<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefly Setup</title>
<style>
  :root { --ink: #fbf7ff; --haze: #b9b3d6; --bg: #0e0b26; --card: #1b1640; --line: rgba(255, 255, 255, .14); --gold: #ffd27a; --bad: #ff8f8f; --good: #8fe0b0; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 50% 20%, #2a1f63, var(--bg) 70%); color: var(--ink); font: 16px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px; text-align: center; }
  img { height: 110px; }
  h1 { font-size: 22px; margin: 6px 0 4px; }
  p { color: var(--haze); margin: 0 0 16px; font-size: 14px; }
  label { display: block; text-align: start; font-size: 14px; margin: 12px 0 6px; }
  input { width: 100%; font: inherit; color: var(--ink); background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; direction: ltr; }
  button { margin-top: 18px; width: 100%; font: 700 16px system-ui, sans-serif; color: #07051a; background: var(--gold); border: 0; border-radius: 999px; padding: 13px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 24px; margin-top: 14px; font-size: 15px; }
  .bad { color: var(--bad); } .good { color: var(--good); }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <img src="luma/chibi_excited.webp" alt="">
  <h1>تجهيز لُمى</h1>
  <p>مرة وحدة بس: حط مفتاح Anthropic حتى تقدر لُمى تحچي وياك. المفتاح يروح مشفّر للخادم ولا يرجع يطلع أبداً.</p>
  <form id="f">
    <label for="code">رمز الدخول</label>
    <input id="code" autocomplete="off" required placeholder="luma-…">
    <label for="key">مفتاح Anthropic (يبدأ بـ sk-ant-api03-)</label>
    <input id="key" type="password" autocomplete="off" required placeholder="sk-ant-api03-…">
    <button id="go">احفظ</button>
  </form>
  <div id="msg"></div>
</main>
<script>
  const msg = document.getElementById("msg"), go = document.getElementById("go");
  const say = (text, cls) => { msg.textContent = text; msg.className = cls || ""; };
  const ERR = {
    wrong_code: "رمز الدخول غير صحيح.",
    not_an_api_key: "هذا مو مفتاح API. لازم يبدأ بـ sk-ant-api03-",
    key_rejected: "Anthropic رفض هذا المفتاح. تأكد إنك نسخته كامل.",
    check_failed: "ما گدرت أتأكد من المفتاح هسه، جرّب بعد شوية.",
    not_configured: "الخادم بعده مو جاهز.",
  };
  fetch("/api/setup").then((r) => r.json()).then((d) => { if (d.ready) say("لُمى جاهزة من قبل ✨ تقدر تغيّر المفتاح من هنا إذا تريد.", "good"); }).catch(() => {});
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    go.disabled = true; say("لحظة، أتأكد من المفتاح…");
    try {
      const r = await fetch("/api/setup", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ code: document.getElementById("code").value.trim(), key: document.getElementById("key").value.trim() }) });
      const d = await r.json().catch(() => ({}));
      if (d.ok) { document.getElementById("key").value = ""; msg.className = "good"; msg.innerHTML = 'تم! لُمى جاهزة ✨ <a href="./">افتح Firefly</a>'; }
      else say(ERR[d.error] || "صار خطأ، جرّب مرة ثانية.", "bad");
    } catch (err) { say("ما وصلت للخادم، تأكد من النت.", "bad"); }
    go.disabled = false;
  };
</script>
</body>
</html>
