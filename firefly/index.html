      const d = document.createElement("div");
      d.className = "i-word i-l"; d.style.left = "50%"; d.style.top = y + "%";
      d.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
      const STEP = 0.06;
      [...text].forEach((ch, k) => {
        const s = document.createElement("span");
        const [bg, fg] = looks[(k + text.length) % looks.length];
        const font = fonts[(k * 7 + text.length) % 3];
        const r = ((k * 37) % 15) - 7;
        s.className = "i-box"; s.textContent = ch;
        s.style.cssText = `background:${bg};color:${fg};font-family:${font};${font.includes("Serif") ? "font-style:italic;" : ""}display:inline-block;opacity:0`;
        d.appendChild(s);
        anim(s, [{ transform: `rotate(${r}deg) scale(2.2)`, opacity: 0 }, { transform: `rotate(${r}deg) scale(1)`, opacity: 1 }], 110, { delay: k * STEP * 1000 });
      });
      add(d);
      return d;
    }
    // glass shards that sweep the screen on a cut
    function shards(color = "#fbf7ff") {
      if (calm) return;
      const polys = ["0 0,70% 0,20% 100%,0 100%", "60% 0,100% 0,100% 55%,35% 100%,15% 100%", "40% 100%,100% 45%,100% 100%"];
      polys.forEach((poly, k) => {
        const d = layer("i-shard", `background:${k === 1 ? "#07051a" : color};clip-path:polygon(${poly})`);
        anim(d, [{ transform: `translate(${k % 2 ? "" : "-"}110%, ${k === 2 ? 40 : -20}%)`, opacity: 1 }, { transform: "translate(0, 0)", opacity: 1, offset: 0.45 }, { transform: `translate(${k % 2 ? "-" : ""}120%, ${k === 2 ? -30 : 25}%)`, opacity: 1 }], 240, { delay: k * 20, easing: "cubic-bezier(.7,0,.3,1)" });
      });
    }
    const speed = () => (calm ? null : layer("i-speed"));
    function grid4() {
      const g = document.createElement("div"); g.className = "i-grid";
      g.innerHTML = ["face_smile", "face_soft", "face_smirk", "face_shy"].map((n) => `<div><img src="${IMG(n)}" alt=""></div>`).join("");
      add(g);
      [...g.children].forEach((c, k) => anim(c, [{ transform: "scale(0) rotate(-12deg)" }, { transform: "scale(1) rotate(0)" }], 140, { delay: k * 55, easing: "cubic-bezier(.3,1.6,.5,1)" }));
    }
    function fireflies(n) {
      for (let k = 0; k < n; k++) {
        const d = document.createElement("div");
        d.className = "i-dot";
        d.style.cssText = `left:${(k * 53) % 100}%;top:${20 + ((k * 37) % 70)}%;--dx:${((k * 29) % 60) - 30}px;--dy:${-30 - ((k * 17) % 50)}px;animation:iDrift ${3 + (k % 4)}s ease-in-out ${(k % 5) * 0.4}s infinite`;
        add(d);
      }
    }
    function moon(size, x, y, ms = 320) {
      const m = document.createElement("div");
      m.className = "i-moon"; m.style.cssText = `width:${size}cqmin;height:${size}cqmin;left:${x}%;top:${y}%`;
      add(m);
      anim(m, [{ transform: "translate(-50%, -50%) scale(.2)", opacity: 0 }, { transform: "translate(-50%, -50%) scale(1.06)", opacity: 1, offset: 0.7 }, { transform: "translate(-50%, -50%) scale(1)", opacity: 1 }], ms);
      return m;
    }
    // the beat you can see: a zoom bump on kicks, a jolt on snares
    function pulse(i) {
      if (calm) return;
      const k = KICKS.has(i), s = SNARES.has(i);
      if (k) stage.animate([{ transform: "scale(1.035)" }, { transform: "scale(1)" }], { duration: 170, easing: "cubic-bezier(.2,.8,.3,1)" });
      if (s) shaker.animate([{ transform: "translate(5px, -3px)" }, { transform: "translate(-4px, 2px)" }, { transform: "translate(0, 0)" }], { duration: 110 });
    }
    // stamps for ransom letters, one per letter
    const stamps = (word, step = 0.06) => [...word].map((_, k) => ["stamp" + (k % 4), k * step, 0.7]);

    // [beat number, picture, sounds as [name, seconds after the beat, volume]]. The music starts at beat 8.
    let START_BEAT = 8;   // 34 after the opening video: it goes straight to the finale (TAKE YOUR TIME … FIREFLY)
    const EVENTS = [
      [8, () => { clear(); layer("i-bg-deep i-halftone"); moon(42, 74, 20, 220); fireflies(14); fig("side", "right", 30, "right:-30cqw;bottom:-14vh;"); flash(0.8); caption("THE NIGHT IS STILL AWAKE", 30); }, [["punch", 0, 0.8]]],
      [10, () => { speed(); caption("…AND SO IS SHE.", 84, "i-gold"); }, [["stamp2", 0, 0.5]]],
      [12, () => { clear(); layer("i-stripes"); speed(); flash(); word("WELCOME", "i-xl i-shadow", 50, 46, -8); shards("#ffd27a"); }, [["punch", 0, 1], ["glitch", 0, 0.8]]],
      [14, () => { slash("#07051a", 240); word("TO THE NIGHT", "i-m i-gold i-shadow", 50, 60, -8); }, [["metal", 0, 0.6]]],
      [16, () => { clear(); layer("i-bg-deep"); strip("face_soft", 38, 20, false); word("SAY HELLO TO…", "i-m i-shadow", 50, 74, -6); }, [["shutter", 0, 0.7]]],
      [18, () => { clear(); layer("i-bg-violet i-halftone"); layer("i-rays", "opacity:.35"); word("LUMA", "i-xl i-outline i-back", 50, 13, -8, 200); fig("front", "left", -40, "bottom:-20vh;"); shards(); caption("YOUR NIGHT FRIEND", 92, "i-gold"); }, [["metal", 0, 1], ["glitch", 0.05, 0.5]]],
      [20, () => { const l = stage.querySelector(".i-outline"); if (l) { l.classList.remove("i-rgb"); void l.offsetWidth; l.classList.add("i-rgb"); } flash(0.35, 100); }, [["glitch", 0, 0.6]]],
      [21, () => flash(0.25, 90), []],
      [22, () => { speed(); flash(0.55, 200); }, []],
      // the drop: a face on every beat
      [23, () => { clear(); layer("i-bg-deep i-halftone"); speed(); strip("face_smirk", 24, 24, true); word("SHE LISTENS.", "i-l i-shadow", 50, 70, -6); }, [["punch", 0, 1], ["shutter", 0.02, 0.6]]],
      [24, () => { clear(); layer("i-bg-violet"); panel("face_smile", 6, 10, 62, 58, -4, "0 4%,100% 0,94% 100%,4% 92%", "-60cqw, 0"); word("SHE REMEMBERS.", "i-m i-shadow", 50, 82, -5); }, [["shutter", 0, 0.8]]],
      [25, () => { clear(); layer("i-bg-gold i-halftone"); panel("face_soft", 32, 22, 62, 58, 5, "6% 0,100% 6%,96% 100%,0 94%", "60cqw, 0"); word("SHE TEASES.", "i-m i-dark", 46, 14, -7); }, [["shutter", 0, 0.8]]],
      [26, () => { clear(); layer("i-bg-deep"); panel("face_shy", 16, 14, 68, 60, -2, "3% 0,100% 3%,97% 100%,0 96%", "0, 60vh", "50% 40%"); word("SHE STAYS.", "i-l i-gold i-shadow", 50, 86, -6); }, [["shutter", 0, 0.8]]],
      [27, () => { clear(); layer("i-stripes"); grid4(); }, [["punch", 0, 0.9], ["stamp0", 0, 0.5], ["stamp1", 0.055, 0.5], ["stamp2", 0.11, 0.5], ["stamp3", 0.165, 0.5]]],
      [29, () => { clear(); layer("i-stripes"); speed(); fig("turn", "right", 40, "bottom:-26vh;", 200); word("THE ONE", "i-m i-shadow", 30, 10, -8); shards("#7b3cff"); }, [["punch", 0, 0.9]]],
      [30, () => word("WHO WAITS UP", "i-m i-shadow", 40, 19, -8), [["stamp1", 0, 0.6]]],
      [31, () => word("FOR YOU", "i-m i-gold i-shadow", 30, 28, -8), [["stamp2", 0, 0.6]]],
      [32, () => { clear(); layer("i-bg-violet"); layer("i-rays", "opacity:.5"); speed(); word("EVERY", "i-l i-shadow", 50, 40, -8); }, [["metal", 0, 0.7]]],
      [33, () => word("NIGHT.", "i-l i-gold i-shadow", 50, 58, -8), [["punch", 0, 0.6]]],
      [34, () => { clear(); layer("i-bg-deep i-halftone"); flash(0.5, 100); ransom("TAKE", 26, -6); }, stamps("TAKE")],
      [35, () => ransom("YOUR", 48, 4), stamps("YOUR")],
      [36, () => { ransom("TIME.", 70, -4); flash(0.9, 180); }, stamps("TIME.").concat([["shatter", 0.26, 1]])],
      [37, () => { shards(); speed(); }, []],
      [38, () => { clear(); layer("i-bg-violet"); slash("#07051a"); moon(80, 50, 46, 220); word("THE NIGHT", "i-l i-shadow", 50, 24, -6); }, [["punch", 0, 0.9]]],
      [39, () => word("IS YOURS.", "i-l i-gold i-shadow", 50, 72, -6), [["metal", 0, 0.5]]],
      [40, () => {
        clear(); layer("", "background:radial-gradient(circle at 50% 40%, rgba(123,60,255,.55), transparent 65%), #07051a"); layer("i-rays", "opacity:.18"); flash(); fireflies(20);
        word("FIREFLY", "i-xl i-shadow", 50, 30, -6, 220); shards("#ffd27a");
      }, [["bell", 0, 0.8], ["metal", 0, 0.8]]],
      [41, () => { const w = document.createElement("div"); w.className = "i-word i-with"; w.textContent = "with Luma"; w.style.cssText = "left:50%;top:44%;transform:translate(-50%,-50%)"; add(w); anim(w, [{ opacity: 0, letterSpacing: ".5em" }, { opacity: 1, letterSpacing: "0em" }], 300); }, []],
      [41.5, () => { const c = new Image(); c.src = poseImg("chibi", "happy"); c.className = "i-chibi"; c.alt = ""; add(c); anim(c, [{ transform: "translate(-50%, 100%)" }, { transform: "translate(-50%, -6%)", offset: 0.7 }, { transform: "translate(-50%, 0)" }], 380, { easing: "cubic-bezier(.3,1.5,.5,1)" }); sound.cute("excited"); }, []],
      [44, () => finish(), []],
    ];
    // whooshes that end exactly on these beats, and a riser into the drop
    const WHOOSH_INTO = [12, 16, 18, 27, 29, 32, 38, 40];
    function buildCues() {
      const list = [];
      for (let i = START_BEAT; i <= 44; i++) if (KICKS.has(i) || SNARES.has(i)) list.push([B(i), () => pulse(i), false]);
      for (const [i, fn, sfx] of EVENTS) if (i >= START_BEAT) list.push([B(i), fn, sfx]);
      for (const i of WHOOSH_INTO) if (i > START_BEAT) list.push([B(i) - 0.26, null, [["@whoosh", 0, 0.26]]]);
      if (START_BEAT < 19) list.push([B(19), null, [["@riser", 0, B(23) - B(19)]]]);
      return list.sort((a, b) => a[0] - b[0]);
    }

    function audioTime() {
      const wall = (performance.now() - clock0) / 1000;
      if (!track || !synced) return wall;
      const tt = track.time();
      const late = performance.now() - begunAt > 1200;
      if (tt == null || tt < wall - 0.6) { if (late) synced = false; return wall; }   // music stalled or blocked: don't freeze
      return tt;
    }
    function tick() {
      if (ended) return;
      const tt = audioTime();
      const lat = sound.latency();
      while (next < cues.length && tt >= cues[next][0] - LOOKAHEAD) {
        const [at, fn, sfx] = cues[next++];
        const wait = Math.max(0, at - tt);
        // sounds go on the audio clock, exactly on the beat
        for (const [name, off, v] of sfx || []) {
          if (name === "@whoosh") sound.whoosh(wait + off, v);
          else if (name === "@riser") sound.riser(wait + off, v);
          else sound.sfx(name, wait + off, v);
        }
        // pictures wait for the speaker, so they appear when the beat is heard
        if (fn) timers.push(setTimeout(() => { try { fn(); } catch (e) {} }, (wait + lat) * 1000));
      }
      raf = requestAnimationFrame(tick);
    }
    function backToBackground() {
      if (track) { track.fadeOut(1000); track = null; }
      if (sound.auto()) setTimeout(() => { if (sound.isOn(BG)) sound.kick(); else sound.start(BG); }, 700);
    }
    function finish() {
      if (ended) return;
      ended = true;
      cancelAnimationFrame(raf);
      const v = root.querySelector(".i-vid video"); if (v) v.pause();
      timers.forEach(clearTimeout); timers = [];
      backToBackground();
      const r = root;
      r.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: "forwards" }).onfinish = () => r.remove();
      state.introSeen = true; persist();
      if (onDone) onDone();
    }
    // Captions over the opening video (intro/opening.mp4, 10 s), placed on its shots:
    // 0.5 the eye, 2.2 she turns, 4.5 glass breaks to her silhouette, 6.45 the swirl, 8.5 the card.
    // [video second, what, text, style, [x, y] on wide screens (over the video), [x, y] on tall screens (above/below it)]
    const VCUES = [
      [0.55, "cap", "THOSE EYES…", "", [50, 88], [50, 22]],
      [1.25, "word", "SEE YOU.", "i-m i-gold i-shadow", [70, 80], [50, 80]],
      [2.25, "clear"],
      [2.25, "word", "HEY,", "i-m i-shadow", [74, 28], [32, 17]],
      [2.75, "word", "YOU.", "i-l i-gold i-shadow", [78, 46], [62, 23]],
      [3.6, "cap", "UP LATE AGAIN?", "", [50, 86], [50, 80]],
      [4.6, "clear"],
      [4.6, "word", "WHO", "i-l i-shadow", [70, 24], [30, 15]],
      [5.1, "word", "IS", "i-l i-shadow", [76, 44], [62, 22]],
      [5.6, "word", "SHE?", "i-xl i-gold i-shadow", [72, 70], [50, 83]],
      [6.5, "clear"],
      [6.5, "cap", "THE NIGHT IS STILL AWAKE", "", [50, 12], [50, 22]],
      [7.4, "cap", "…AND SO IS SHE.", "i-gold", [50, 90], [50, 79]],
      [8.55, "clear"],
      [8.55, "word", "READY?", "i-l i-dark", [78, 50], [50, 81]],
    ];
    function vcue(c, wide) {
      const [, what, text, cls, w, t] = c;
      if (what === "clear") return target.querySelectorAll(".i-word").forEach((n) => n.remove());
      const [x, y] = wide ? w : t;
      if (what === "cap") caption(text, y, cls);
      else word(text, wide ? cls : cls.replace("i-dark", "i-gold i-shadow"), x, y, -8);
      if (what === "cap" && x !== 50) target.lastChild.style.left = x + "%";
    }
    function runVideo(v) {
      let k = 0, lastT = -1, stuckSince = performance.now();
      const wide = matchMedia("(min-aspect-ratio: 6/5)").matches;
      target = root.querySelector(wide ? ".i-vbox" : ".i-vtext");
      const step = () => {
        if (ended) return;
        const tt = v.currentTime;
        if (tt !== lastT) { lastT = tt; stuckSince = performance.now(); }
        while (k < VCUES.length && tt >= VCUES[k][0]) { try { vcue(VCUES[k], wide); } catch (e) {} k++; }
        // on to the music when it ends, or if it stalls for 3 s
        if (v.ended || tt >= v.duration - 0.05 || performance.now() - stuckSince > 3000) return afterVideo(v);
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }
    async function afterVideo(v) {
      const box = root.querySelector(".i-vid");
      target = null;
      v.pause();
      box.animate([{ opacity: 1, filter: "brightness(1)" }, { opacity: 0, filter: "brightness(3)" }], { duration: 180, fill: "forwards" }).onfinish = () => box.remove();
      await Promise.race([ready, new Promise((r) => setTimeout(r, 4000))]);
      if (!ended) startMusic();
    }
    async function begin() {
      if (begun) return;
      begun = true;
      sound.unlock();
      const st = root.querySelector(".i-start");
      st.style.pointerEvents = "none";
      const fxBtn = root.querySelector(".i-fx"); if (fxBtn) fxBtn.remove();
      if (sound.isOn(BG)) sound.stop(BG);
      sound.preloadVoices();
      // the opening video starts inside the tap itself, so phones allow its sound
      const v = root.querySelector(".i-vid video");
      let playing = null;
      if (v) { root.querySelector(".i-vid").hidden = false; playing = v.play(); }
      const out = () => st.animate([{ transform: "scale(1)", opacity: 1, filter: "brightness(1)" }, { transform: "scale(1.25)", opacity: 0, filter: "brightness(2.5)" }], { duration: 260, easing: "ease-in", fill: "forwards" }).onfinish = () => st.remove();
      if (playing) {
        try {
          await playing;
          if (ended) return;
          out(); START_BEAT = 34;
          runVideo(v);
          return;
        } catch (e) { root.querySelector(".i-vid").remove(); }
      }
      // no video: straight into the music (everything is normally decoded while the title shows)
      if (!isReady) { const tap = st.querySelector(".i-tap"); if (tap) tap.textContent = "LOADING…"; }
      await Promise.race([ready, new Promise((r) => setTimeout(r, 6000))]);
      if (ended) return;
      out();
      startMusic();
    }
    function startMusic() {
      const from = B(START_BEAT) - 0.25;
      track = sound.track("intro", 0.9, from) || sound.clip("music/intro.mp3", 0.9, from);
      synced = true; begunAt = performance.now();
      sound.preloadVoices();
      clock0 = performance.now() - from * 1000;
      cues = buildCues(); next = 0; raf = requestAnimationFrame(tick);
    }
    // fetch and decode the music, effects and pictures while the title screen is up
    function preload() {
      const pics = ["front", "turn", "side", "face_smile", "face_smirk", "face_soft", "face_shy"].map(IMG).concat(poseImg("chibi", "happy"));
      keep = pics.map((src) => { const im = new Image(); im.src = src; return im; });
      ready = Promise.all([sound.load("intro", "music/intro.mp3"), sound.loadSfx(SFX)].concat(keep.map((im) => (im.decode ? im.decode() : Promise.resolve()).catch(() => {}))))
        .then(() => { isReady = true; });
    }
    function play(done) {
      onDone = done; ended = false; begun = false; isReady = false; track = null; timers = []; target = null; START_BEAT = 8;
      root = document.createElement("div");
      root.id = "intro";
      root.innerHTML = `
        <div class="i-shake"><div class="i-stage"></div></div>
        <div class="i-vid" hidden><div class="i-vbox"><video playsinline preload="auto"><source src="intro/opening.mp4" type="video/mp4"><source src="intro/opening.webm" type="video/webm"></video></div><div class="i-vtext"></div></div>
        <div class="i-grain"></div>
        <div class="i-start" role="button" tabindex="0" aria-label="Start">
          <div class="i-logo">FIREFLY</div>
          <div class="i-with">with Luma</div>
          <div class="i-tap">TAP TO START</div>
          <div class="i-hint">🎧 ${lang === "ar" ? "شغّل الصوت" : "Sound on"}</div>
          <img class="i-peek" src="${poseImg("chibi", "excited")}" alt="">
        </div>
        <button class="i-skip" type="button">${lang === "ar" ? "تخطَّ ›" : "Skip ›"}</button>
        ${reduce ? `<button class="i-fx" type="button" aria-pressed="false">✨ ${lang === "ar" ? "حركة كاملة" : "Full motion"}</button>` : ""}`;
      document.body.appendChild(root);
      shaker = root.querySelector(".i-shake");
      stage = root.querySelector(".i-stage");
      const start = root.querySelector(".i-start");
      // fireflies drift on the title screen too
      for (let k = 0; k < 14; k++) { const d = document.createElement("div"); d.className = "i-dot"; d.style.cssText = `left:${(k * 53) % 100}%;top:${10 + ((k * 37) % 80)}%;--dx:${((k * 29) % 60) - 30}px;--dy:${-30 - ((k * 17) % 50)}px;animation:iDrift ${3 + (k % 4)}s ease-in-out ${(k % 5) * 0.4}s infinite`; start.appendChild(d); }
      preload();
      start.onclick = begin;
      start.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") begin(); };
      root.querySelector(".i-skip").onclick = () => { sound.ensure(); finish(); };
      const fx = root.querySelector(".i-fx");
      const showFx = () => { calm = reduce && !fullFx(); root.classList.toggle("i-full", !calm); document.documentElement.classList.toggle("ff-full", fullFx()); if (fx) fx.setAttribute("aria-pressed", String(!calm)); };
      showFx();
      if (fx) fx.onclick = () => { try { localStorage.setItem(FX_LS, calm ? "full" : "calm"); } catch (e) {} showFx(); };
    }
    return { play };
  })();

  // ================= start =================
  const UNLOCK = ["pointerdown", "touchstart", "keydown", "click"];
  const firstTouch = () => {
    if (document.getElementById("intro")) { sound.ensure(); return; }   // the intro has its own music
    if (sound.auto()) { if (sound.isOn(BG)) sound.kick(); else if (!sound.playing()) sound.start(BG); }
    if (sound.ensure()) sound.preloadVoices();
    // keep listening until sound is really playing (some browsers need a second gesture)
    setTimeout(() => { if (!sound.auto() || sound.audible()) UNLOCK.forEach((ev) => removeEventListener(ev, firstTouch, true)); }, 400);
  };
  UNLOCK.forEach((ev) => addEventListener(ev, firstTouch, { capture: true, passive: true }));
  // Start the song as soon as the page opens, if the browser allows sound without a touch.
  renderChrome();
  show(state.onboarded ? "home" : "onboard");
  // the intro plays every time the app opens; the app is ready underneath
  intro.play(() => { suggestAt = 0; show(state.onboarded ? "home" : "onboard"); });
  connectStore();
  pullSite();
})();
</script>
