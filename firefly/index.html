<title>Firefly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a living night meadow fills the screen; one quiet glass panel floats over its lower part and changes with each step of the evening. The land always sits just above the panel. */
  :root {
    --night: #0b0d2a;
    --glow: #ffd27a;
    --glow-deep: #f2a83b;
    --mist: #ecebf8;
    --haze: #a9a6cc;
    --glass: rgba(20, 20, 52, 0.64);
    --glass-line: rgba(236, 235, 248, 0.14);
    --chip: rgba(236, 235, 248, 0.08);
    --luma: rgba(255, 210, 122, 0.10);
    --me: rgba(236, 235, 248, 0.12);
    --star: #cfe3ff;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--mist); font: 16px/1.55 var(--body); overflow: hidden; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top {
    position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .brand { font-family: var(--display); font-size: 24px; font-style: italic; color: var(--glow); text-shadow: 0 0 18px rgba(255, 210, 122, .45); }
  .count { font-size: 13px; color: var(--haze); letter-spacing: .04em; }
  .top button { pointer-events: auto; }

  .tip {
    position: fixed; z-index: 4; max-width: 240px; transform: translate(-50%, calc(-100% - 14px));
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; padding: 8px 12px;
    font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.3;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    animation: rise .3s ease both; pointer-events: none;
  }
  .tip small { display: block; font: 12px var(--body); color: var(--haze); font-style: normal; margin-top: 2px; }

  .stage {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; justify-content: center;
  }
  .panel {
    width: 100%; max-width: 540px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px;
    padding: 22px 20px 20px;
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    display: flex; flex-direction: column; gap: 14px;
    max-height: calc(100dvh - 120px - env(safe-area-inset-top, 0px));
    min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  .panel > * { flex-shrink: 0; }
  .panel.chat { overflow: hidden; }
  .panel.chat > .talk { flex-shrink: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--haze); margin: 0; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
  h1 { font-size: 40px; } h2 { font-size: 30px; } h3 { font-size: 22px; }
  h1 em, h2 em { color: var(--glow); }
  p { margin: 0; }
  .soft { color: var(--haze); font-size: 15px; }
  .tiny { font-size: 12px; color: var(--haze); }

  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--glow); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .primary {
    border: 0; border-radius: 999px; padding: 14px 22px;
    background: linear-gradient(180deg, var(--glow), var(--glow-deep));
    color: #2a1a05; font-weight: 700; font-size: 16px; text-decoration: none; display: inline-block;
    box-shadow: 0 0 28px rgba(255, 210, 122, .35); transition: transform .15s, box-shadow .3s;
  }
  .primary:hover { box-shadow: 0 0 40px rgba(255, 210, 122, .55); }
  .primary:active { transform: scale(.97); }
  .primary:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .ghost { border: 1px solid var(--glass-line); background: transparent; border-radius: 999px; padding: 12px 18px; color: var(--mist); font-weight: 600; text-decoration: none; display: inline-block; }
  .text-btn { border: 0; background: none; color: var(--haze); padding: 6px 4px; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .back { border: 0; background: none; color: var(--haze); padding: 0; font-size: 14px; font-weight: 600; align-self: flex-start; }
  .round {
    border: 1px solid var(--glass-line); background: var(--glass); color: var(--mist);
    border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .eq i { width: 3px; background: var(--glow); border-radius: 2px; height: 4px; }
  .eq.on i { animation: eq 1s ease-in-out infinite; }
  .eq.on i:nth-child(2) { animation-delay: .2s; } .eq.on i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 50% { height: 12px; } }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .row.split { justify-content: space-between; }

  .note { border: 1px solid var(--glass-line); border-radius: 18px; padding: 14px 16px; background: var(--luma); }
  .note .who { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); margin-bottom: 4px; }
  .note blockquote { margin: 0; font-family: var(--display); font-size: 21px; line-height: 1.3; font-style: italic; white-space: pre-wrap; }

  /* meadow activities */
  .tiles { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px 4px; }
  .tiles::-webkit-scrollbar { display: none; }
  .tile {
    flex: 0 0 128px; scroll-snap-align: start; text-align: left;
    border: 1px solid var(--glass-line); background: var(--chip); border-radius: 18px;
    padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
    transition: border-color .2s, background .2s;
  }
  .tile:hover { border-color: rgba(255, 210, 122, .4); background: rgba(255, 210, 122, .07); }
  .tile svg { width: 22px; height: 22px; color: var(--glow); }
  .tile b { font-size: 14px; }
  .tile span { font-size: 12px; color: var(--haze); line-height: 1.35; }

  /* breathing orb */
  .orb-wrap { display: grid; place-items: center; height: 180px; }
  .orb {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle, #fff3cf 0%, var(--glow) 40%, rgba(255, 210, 122, 0) 72%);
    box-shadow: 0 0 60px rgba(255, 210, 122, .5);
    transition: transform 4s ease-in-out;
  }
  .breath-word { font-family: var(--display); font-size: 30px; text-align: center; min-height: 40px; }

  .weights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .weights button {
    border: 1px solid var(--glass-line); background: var(--chip); border-radius: 16px;
    padding: 12px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 12px; color: var(--haze); min-width: 0;
  }
  .weights i { display: block; border-radius: 50%; background: var(--haze); opacity: .8; }
  .weights button[aria-pressed="true"] { border-color: var(--glow); color: var(--mist); background: rgba(255, 210, 122, .12); }
  .weights button[aria-pressed="true"] i { background: var(--glow); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 1px solid var(--glass-line); background: var(--chip); border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--mist); }
  .chips button[aria-pressed="true"] { border-color: var(--glow); background: rgba(255, 210, 122, .14); }

  .talk { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 120px; flex: 1; padding-right: 2px; overscroll-behavior: contain; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise .35s ease both; }
  .msg.luma { background: var(--luma); border: 1px solid rgba(255, 210, 122, .18); align-self: flex-start; border-bottom-left-radius: 6px; }
  .msg.me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 6px; }
  .msg.wait { color: var(--haze); font-style: italic; }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea, input[type="text"], input[type="time"] {
    flex: 1; min-width: 0; font: inherit; color: var(--mist);
    background: rgba(0, 0, 0, .25); border: 1px solid var(--glass-line); border-radius: 18px; padding: 12px 14px; resize: none;
  }
  input[type="time"] { flex: 0 0 auto; }
  textarea { max-height: 120px; }
  ::placeholder { color: var(--haze); opacity: .8; }
  .send { flex: none; width: 48px; height: 48px; padding: 0; display: grid; place-items: center; }
  .send svg { width: 20px; height: 20px; }

  .stats { display: flex; gap: 20px; flex-wrap: wrap; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font-family: var(--display); font-size: 30px; font-weight: 400; color: var(--glow); line-height: 1; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 13px; color: var(--haze); }
  .progress { height: 4px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--glow-deep), var(--glow)); border-radius: 4px; transition: width 1s ease; }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 3px; border-radius: 3px; background: var(--chip); }
  .steps i.on { background: var(--glow); }

  /* sounds */
  #wave { width: 100%; height: 64px; display: block; border-radius: 14px; background: rgba(0, 0, 0, .2); }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .layer { border: 1px solid var(--glass-line); background: var(--chip); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .layer.on { border-color: rgba(255, 210, 122, .55); background: rgba(255, 210, 122, .08); }
  .layer button { border: 0; background: none; padding: 0; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .switch { width: 30px; height: 18px; border-radius: 999px; background: var(--chip); border: 1px solid var(--glass-line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--haze); transition: transform .2s; }
  .layer.on .switch { background: rgba(255, 210, 122, .35); }
  .layer.on .switch::after { transform: translateX(12px); background: var(--glow); }
  input[type="range"] { width: 100%; accent-color: var(--glow-deep); }

  /* gift */
  .gift {
    border: 1px solid rgba(255, 210, 122, .4); border-radius: 20px; padding: 18px;
    background: linear-gradient(160deg, rgba(255, 210, 122, .14), rgba(140, 120, 255, .08));
    text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%;
  }
  .gift.sealed { align-items: center; text-align: center; animation: glowPulse 2.4s ease-in-out infinite; }
  .gift.open { animation: unfold .7s cubic-bezier(.2, 1.3, .4, 1) both; }
  .gift .kind { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--glow); }
  .gift .body { font-family: var(--display); font-size: 22px; line-height: 1.3; white-space: pre-wrap; }
  @keyframes glowPulse { 50% { box-shadow: 0 0 34px rgba(255, 210, 122, .35); } }
  @keyframes unfold { from { opacity: 0; transform: rotateX(70deg) scale(.9); } to { opacity: 1; transform: none; } }

  .story { font-family: var(--display); font-size: 21px; line-height: 1.5; white-space: pre-wrap; }
  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
  .list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--glass-line); font-size: 15px; }
  .list li:first-child { border-top: 0; }
  .list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list li small { color: var(--haze); white-space: nowrap; }
  .list button { border: 0; background: none; color: var(--haze); padding: 0 4px; font-size: 15px; }
  .chart { width: 100%; aspect-ratio: 300 / 96; display: block; }
  .chart text { fill: var(--haze); font: 11px var(--body); }

  @media (max-height: 640px) {
    h1 { font-size: 32px; } h2 { font-size: 25px; }
    .orb-wrap { height: 130px; }
    .panel { padding: 18px 16px 16px; gap: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="top">
  <span class="brand">Firefly</span>
  <div class="row">
    <span class="count" id="count"></span>
    <button class="round" id="sound-btn"><span class="eq" id="eq"><i></i><i></i><i></i></span>Sounds</button>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<div class="stage"><section class="panel" id="panel" aria-live="polite"></section></div>

<script>
(() => {
  // ================= content =================
  const MILESTONES = [
    { at: 1, label: "your first firefly" },
    { at: 3, label: "a light in the cabin window" },
    { at: 7, label: "the old tree blossoms" },
    { at: 14, label: "shooting stars" },
    { at: 21, label: "a pond that holds the moon" },
    { at: 30, label: "the northern lights" },
  ];
  const WEIGHTS = [
    { v: 1, label: "Light", size: 8 }, { v: 2, label: "Okay", size: 12 }, { v: 3, label: "Heavy", size: 16 },
    { v: 4, label: "Very", size: 20 }, { v: 5, label: "Crushing", size: 25 },
  ];
  const WEIGHT_WORDS = ["", "light", "okay", "heavy", "very heavy", "crushing"];
  const TAGS = ["Work", "Tiredness", "People", "Money", "Worry", "Health", "Boredom", "Nothing much"];
  const BREATHS = {
    calm: { name: "Calm", hint: "In 4 · hold 2 · out 6", steps: [["Breathe in", 4], ["Hold", 2], ["Breathe out", 6]] },
    box: { name: "Box", hint: "4 · 4 · 4 · 4, steadying", steps: [["Breathe in", 4], ["Hold", 4], ["Breathe out", 4], ["Hold", 4]] },
    sleep: { name: "Sleep", hint: "In 4 · hold 7 · out 8", steps: [["Breathe in", 4], ["Hold", 7], ["Breathe out", 8]] },
  };
  // Gifts: one sealed gift each evening. Mostly gentle, sometimes rare.
  const GIFTS = {
    "Kind words": [
      "You don't have to earn rest. You're allowed to just have it.",
      "Being tired isn't failing. It's information.",
      "Some days the win is that you got through it. Today counts.",
      "You're doing better than your inner critic says. It has a bad view from in there.",
      "Passion often comes back quietly, after rest, not before it.",
      "The people who love you would want you to go easier on yourself.",
      "You showed up for yourself tonight. That was a choice, and you made it.",
    ],
    "Night fact": [
      "Fireflies are beetles, not flies.",
      "A firefly's glow is \"cold light\": almost all the energy becomes light, and very little becomes heat.",
      "In the Great Smoky Mountains, one kind of firefly flashes in sync for a couple of weeks each summer.",
      "Firefly larvae glow too. Some people call them glow-worms.",
      "There are around 2,000 kinds of fireflies in the world, and each has its own flash pattern.",
      "The light from some stars you can see tonight left them hundreds of years ago.",
      "The Moon drifts about 3.8 cm farther from Earth every year.",
      "Owls can't move their eyes in their sockets, so they turn their whole heads instead.",
    ],
    "Tiny challenge": [
      "Tomorrow, take three slow breaths before you open your email.",
      "Drink a full glass of water before your first coffee tomorrow.",
      "Step outside for two minutes tomorrow and look at the sky.",
      "Send one kind message to someone tomorrow. No reason needed.",
      "Keep your phone out of reach for the first 10 minutes after you wake up.",
      "Eat lunch away from your desk tomorrow, even for 15 minutes.",
      "Tomorrow, write down one thing you did well at work, however small.",
      "Tonight, dim the lights an hour before bed.",
    ],
    "Small poem": [
      "The day is set down\nlike a heavy bag at the door.\nThe night asks for nothing.",
      "Small lights in the grass,\nnone of them trying to be the moon,\nall of them enough.",
      "Rain on the cabin roof.\nTomorrow can wait\nout there in the dark.",
      "You carried it all day.\nHere, the hill will hold it\nuntil morning.",
      "No inbox in the meadow.\nOnly crickets keeping time\nfor no one at all.",
    ],
  };
  const STORIES = [
    "You walk the last few steps up the hill. The grass is cool and a little damp, and it brushes your ankles like it remembers you.\n\nThe cabin window is lit. Inside, a kettle ticks as it cools. You sit by the window and watch the fireflies drift low over the meadow, slow as thoughts that no longer need answering.\n\nThe rain starts, so softly at first that it sounds like someone turning pages. You let your shoulders drop. You let your jaw unclench. There's nothing left to do tonight, and nowhere to be.\n\nOne firefly lands on the glass, glows twice, and moves on. You breathe out, long and slow, and the room gets warmer, and the sound of the rain gets farther away, and farther, and you drift.",
    "The pond at the bottom of the meadow is so still it holds the whole moon. You sit on the old wooden bench beside it and pull a blanket around your shoulders.\n\nSomewhere, crickets are keeping a slow rhythm. A breeze moves through the tall grass in long waves, the way the sea moves, the way breathing moves.\n\nYou notice the weight of your body on the bench. Your hands are heavy and warm. Your feet are heavy and warm. Each breath out is a little longer than the one before.\n\nA few fireflies drift across the water, and their reflections drift with them, two lights for every one. You watch them until you can't tell which are which, and your eyes grow heavy, and the meadow keeps watch while you sleep.",
  ];

  // ================= state =================
  const LS = "firefly-v1";
  function blank() {
    return { name: "", fireflies: 0, golden: 0, streak: 0, best: 0, lastDate: null, graceDate: null,
      memory: [], intention: null, history: [], stars: [], gifts: [], seenGifts: [] };
  }
  let state = blank();
  try { const saved = JSON.parse(localStorage.getItem(LS)); if (saved && typeof saved === "object") state = Object.assign(blank(), saved); } catch (e) {}

  const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return dayKey(d); };
  const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
  const doneTonight = () => state.lastDate === dayKey();
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  // Each person's evenings live privately in the artifact's store
  // (browser storage only when the store is unavailable).
  let docRef = null, writing = Promise.resolve();
  function persist() {
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (!docRef) return;
    const body = JSON.parse(JSON.stringify(state));
    writing = writing.then(() => docRef.set(body)).catch(() => {});
  }
  async function connectStore() {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    try {
      const ref = db.doc("data/users/" + id + "/firefly");
      const snap = await ref.get();
      docRef = ref;
      if (snap.exists) {
        const remote = Object.assign(blank(), snap.data());
        if ((remote.fireflies || 0) >= (state.fireflies || 0)) {
          state = remote;
          try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
          syncSky(); renderCount();
          if (screen === "home") show("home");
        } else persist();
      } else if (state.fireflies) persist();
    } catch (e) { docRef = null; }
  }

  // ================= Luma (real AI) =================
  let sample = null, aiOff = false;
  const aiReady = (window.claude && window.claude.use) ? claude.use("sample").then((s) => { sample = s; return s; }) : Promise.resolve(null);

  function rules(session) {
    const mem = state.memory.length ? state.memory.map((m) => "- " + m).join("\n") : "- nothing yet, this may be one of your first evenings together";
    const last = state.intention && state.intention.date !== dayKey()
      ? `Last time they planned this small thing: "${state.intention.text}"` + (state.intention.done === true ? " (they did it)." : state.intention.done === false ? " (it didn't happen, and that's fine)." : ".")
      : "";
    const today = session && session.weight
      ? `Tonight they said the day felt ${WEIGHT_WORDS[session.weight]}${session.tags.length ? ", and what weighed on it was: " + session.tags.join(", ") : ""}.`
      : "";
    return `You are Luma, a gentle companion inside Firefly, an app people open for a calm few minutes in the evening, usually after work. Many of them are tired, close to burnout, or have lost their passion for work.

How you talk:
- Warm, calm and unhurried, like a kind friend sitting on a porch at night. A little playful. Light humor only when it fits, never at their expense.
- 1 to 3 short sentences. Plain text. No lists, no headings. At most one emoji, and only sometimes.
- Reflect something specific they said, then ask at most one gentle question. Let them lead.
- Don't lecture or give advice unless they ask. If you suggest something, make it tiny and concrete.

        if (newcomer.k >= 1) { const f = makeFly(); f.x = x; f.y = y; (newcomer.gold ? goldFlies : flies).push(f); newcomer = null; }
      }
      for (const sp of sparks) {
        sp.k = Math.min(1, sp.k + 0.012);
        const e = 1 - (1 - sp.k) ** 2, [x1, y1] = starPos(sp.star);
        glow(sp.x0 + (x1 - sp.x0) * e, sp.y0 + (y1 - sp.y0) * e, 16, 1 - e * 0.5, "190,215,255");
        if (sp.k >= 1) userStars.push(sp.star);
      }
      sparks = sparks.filter((sp) => sp.k < 1);
      for (const l of lanterns) {
        l.age += 0.016; l.y -= 0.55; l.x += Math.sin(l.age * 1.3 + l.p) * 0.35;
        const a = Math.max(0, Math.min(1, l.age * 1.5) * (1 - l.age / 9));
        glow(l.x, l.y, 46, a * 0.55, "255,170,90");
        cx.fillStyle = `rgba(255,205,140,${a * 0.9})`;
        cx.beginPath(); cx.roundRect ? cx.roundRect(l.x - 9, l.y - 12, 18, 22, 6) : cx.rect(l.x - 9, l.y - 12, 18, 22); cx.fill();
        cx.fillStyle = `rgba(236,235,248,${a * 0.85})`;
        cx.font = "italic 15px 'Instrument Serif', Georgia, serif"; cx.textAlign = "center";
        cx.fillText(l.text, l.x, l.y + 34);
      }
      lanterns = lanterns.filter((l) => l.age < 9);
    }
    function loop(t) { draw(t); if (!still) requestAnimationFrame(loop); }
    fit();
    addEventListener("resize", () => { fit(); if (still) draw(0); });
    requestAnimationFrame(loop);

    // Tap a star of your own to read it again.
    const tip = document.getElementById("tip");
    let tipTimer = null;
    cv.addEventListener("click", (e) => {
      let best = null, bd = 26;
      for (const st of userStars) { const [x, y] = starPos(st), d = Math.hypot(x - e.clientX, y - e.clientY); if (d < bd) { bd = d; best = st; } }
      if (!best) { tip.hidden = true; return; }
      const [x, y] = starPos(best);
      tip.innerHTML = `${esc(best.text)}<small>${new Date(best.date + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small>`;
      tip.style.left = Math.max(130, Math.min(W - 130, x)) + "px"; tip.style.top = y + "px";
      tip.hidden = false;
      clearTimeout(tipTimer); tipTimer = setTimeout(() => (tip.hidden = true), 5000);
    });

    return {
      setCount, setFloor,
      setStars(list) { userStars = list.slice(); },
      addStar(star, fromY) { sparks.push({ star, x0: W / 2, y0: fromY, k: 0 }); if (still) { userStars.push(star); draw(0); } },
      release(text) {
        const short = text.length > 34 ? text.slice(0, 32) + "…" : text;
        lanterns.push({ x: W * rnd(0.3, 0.7), y: F - 10, text: short, age: 0, p: rnd(0, 6) });
        if (still) draw(0);
      },
      lightOne(gold) {
        newcomer = { x0: W / 2, y0: F + 30, x1: rnd(0.25, 0.75) * W, y1: rnd(0.55, 0.9) * F, k: 0, gold };
        if (gold) golden++; else count++;
        if (still) { setCount(count, golden); draw(0); }
      },
    };
  })();
  function syncSky() { sky.setCount(state.fireflies, state.golden); sky.setStars(state.stars); }
  syncSky();

  // ================= screens =================
  const panel = document.getElementById("panel");
  let screen = "home", session = null, cleanup = null;
  const $ = (sel) => panel.querySelector(sel);
  const $$ = (sel) => panel.querySelectorAll(sel);
  function el(html, cls = "") {
    panel.className = "panel " + cls;
    panel.innerHTML = html;
    panel.scrollTop = 0;
    panel.style.animation = "none"; void panel.offsetWidth; panel.style.animation = "";
  }
  const stepBar = (n) => `<div class="steps" aria-label="Step ${n} of 5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>`;
  const backBtn = (label = "Meadow") => `<button class="back" data-back>← ${label}</button>`;
  function wireBack(to = "home") { const b = $("[data-back]"); if (b) b.onclick = () => show(to); }

  function renderCount() {
    const n = state.fireflies + state.golden;
    document.getElementById("count").textContent = n ? `${n} firefl${n === 1 ? "y" : "ies"}` : "";
  }
  const nextMilestone = () => MILESTONES.find((m) => m.at > state.fireflies);
  const prevMilestoneAt = () => { const d = MILESTONES.filter((m) => m.at <= state.fireflies); return d.length ? d[d.length - 1].at : 0; };

  function show(name, arg) {
    if (cleanup) { cleanup(); cleanup = null; }
    screen = name;
    SCREENS[name](arg);
    syncFloor();
  }
  function syncFloor() { sky.setFloor(panel.getBoundingClientRect().top - 8); }
  new ResizeObserver(syncFloor).observe(panel);
  addEventListener("resize", syncFloor);

  const ICONS = {
    sound: '<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>',
    breath: '<circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" opacity=".5"/>',
    star: '<path d="M12 3v6M12 15v6M3 12h6M15 12h6M7 7l2.5 2.5M14.5 14.5L17 17M17 7l-2.5 2.5M9.5 14.5L7 17"/>',
    book: '<path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/>',
    talk: '<path d="M4 6h16v10H9l-5 4z"/>',
    lantern: '<rect x="8" y="7" width="8" height="11" rx="3"/><path d="M12 3v4M10 21h4"/>',
    moon: '<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
  };
  const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;

  // ---------- home ----------
  function home() {
    const h = new Date().getHours();
    const part = h < 5 ? "Late night" : h < 12 ? "Morning" : h < 17 ? "Afternoon" : "Evening";
    const weekday = new Date().toLocaleDateString(undefined, { weekday: "long" });
    const next = nextMilestone(), from = prevMilestoneAt();
    const pct = next ? Math.round(((state.fireflies - from) / (next.at - from)) * 100) : 100;
    const pendingIntention = state.intention && state.intention.date !== dayKey() && state.intention.done == null;
    const first = !state.fireflies;
    const hi = state.name ? `, ${esc(state.name)}` : "";
    const greeting = first ? "Hello. <em>Breathe out.</em>" : doneTonight() ? `Tonight's light <em>is lit${hi}.</em>` : `Welcome back${hi}. <em>Sit a while.</em>`;
    const lead = first
      ? "Seven quiet minutes each evening. Talk it out with Luma, let a worry go, and light a firefly. Come back each night and the hill slowly comes alive."
      : doneTonight()
        ? "Stay as long as you like. Put on some sounds, hear a bedtime story, or add a star to your sky."
        : "The meadow kept your fireflies safe. Tonight's gift is waiting at the end.";
    const tiles = [
      ["sounds", "sound", "Sounds", "Rain, waves, brainwave tones"],
      ["story", "book", "Bedtime story", "Luma writes one for you"],
      ["stars", "star", "Your stars", "Good moments in your sky"],
      ["breathe-free", "breath", "Breathe", "Calm, box or sleep"],
      ["lanterns", "lantern", "Lanterns", "Let a worry float away"],
      ["talk-free", "talk", "Talk to Luma", "Any time you need"],
      ["nights", "moon", "Your nights", "Patterns, gifts, reminder"],
    ];
    el(`
      <p class="eyebrow">${esc(weekday)} · ${part}</p>
      <h1>${greeting}</h1>
      <p class="soft">${lead}</p>
      ${pendingIntention ? `
        <div class="note" id="intent">
          <div class="who">Last time you planned</div>
          <blockquote>${esc(state.intention.text)}</blockquote>
          <div class="row" style="margin-top:10px"><button class="ghost" data-did="1">It happened</button><button class="text-btn" data-did="0">Not yet, that's okay</button></div>
        </div>` : ""}
      ${state.fireflies ? `<div class="stats">
          <div><b>${state.fireflies + state.golden}</b><span>fireflies</span></div>
          <div><b>${state.streak}</b><span>night${state.streak === 1 ? "" : "s"} in a row</span></div>
          <div><b>${state.stars.length}</b><span>star${state.stars.length === 1 ? "" : "s"}</span></div>
        </div>` : ""}
      ${next ? `<div><div class="progress"><i style="width:${pct}%"></i></div><p class="tiny" style="margin-top:6px">${next.at - state.fireflies} more night${next.at - state.fireflies === 1 ? "" : "s"} until ${next.label}</p></div>`
             : `<p class="tiny">The whole hill is awake. Every firefly here is an evening you showed up for yourself.</p>`}
      <div class="row split">
        ${doneTonight() ? "" : `<button class="primary" id="begin">${first ? "Light your first firefly" : "Begin tonight · 7 min"}</button>`}
        ${doneTonight() || first ? "" : `<button class="text-btn" id="quick">Too tired? 1-minute version</button>`}
      </div>
      <p class="eyebrow">In the meadow</p>
      <div class="tiles">${tiles.map(([to, ic, t, d]) => `<button class="tile" data-to="${to}">${icon(ic)}<b>${t}</b><span>${d}</span></button>`).join("")}</div>
    `);
    const newSession = (quick) => ({ quick, weight: 0, tags: [], turns: [], worries: [], intention: "" });
    const begin = $("#begin");
    if (begin) begin.onclick = () => { session = newSession(false); show("breathe"); };
    const quick = $("#quick");
    if (quick) quick.onclick = () => { session = newSession(true); show("checkin"); };
    $$("[data-to]").forEach((b) => b.onclick = () => show(b.dataset.to));
    $$("[data-did]").forEach((b) => b.onclick = () => {
      state.intention.done = b.dataset.did === "1";
      persist();
      $("#intent").innerHTML = state.intention.done
        ? `<div class="who">Nicely done</div><blockquote>Small things done tired count double.</blockquote>`
        : `<div class="who">That's okay</div><blockquote>Tomorrow is a fresh page.</blockquote>`;
    });
  }

  // ---------- breathing (ritual step and free practice) ----------
  function breathe(free) {
    const key = free ? (breathe.key || "calm") : "calm";
    el(`
      ${free ? backBtn() : stepBar(1)}
      <p class="eyebrow">${free ? "Breathe" : "Arrive"}</p>
      <h2>${free ? "Follow the light." : "Leave the day at the door."}</h2>
      ${free ? `<div class="chips" role="group" aria-label="Breathing pattern">${Object.entries(BREATHS).map(([k, b]) => `<button data-b="${k}" aria-pressed="${k === key}">${b.name}</button>`).join("")}</div><p class="tiny">${BREATHS[key].hint}</p>` : ""}
      <div class="orb-wrap"><div class="orb" id="orb"></div></div>
      <p class="breath-word" id="word">Get comfortable</p>
      <div class="row split">
        ${free ? `<span class="tiny" id="rounds"></span><button class="ghost" data-back2>Done</button>` : `<button class="text-btn" id="skip">Skip</button><button class="ghost" id="next" hidden>Continue</button>`}
      </div>
    `);
    if (free) {
      wireBack();
      $("[data-back2]").onclick = () => show("home");
      $$("[data-b]").forEach((b) => b.onclick = () => { breathe.key = b.dataset.b; show("breathe-free"); });
    }
    const orb = $("#orb"), word = $("#word"), pattern = BREATHS[key].steps;
    let i = 0, rounds = 0, t = null, alive = true;
    cleanup = () => { alive = false; clearTimeout(t); };
    const step = () => {
      if (!alive) return;
      const [w, sec] = pattern[i % pattern.length];
      word.textContent = w;
      orb.style.transitionDuration = sec + "s";
      if (w === "Breathe in") orb.style.transform = "scale(2.3)";
      if (w === "Breathe out") orb.style.transform = "scale(1)";
      i++;
      if (i % pattern.length === 0) {
        rounds++;
        if (free) $("#rounds").textContent = `${rounds} breath${rounds > 1 ? "s" : ""}`;
        if (!free && rounds >= 3) { t = setTimeout(() => { word.textContent = "Good. You're here now."; $("#next").hidden = false; }, sec * 1000); return; }
      }
      t = setTimeout(step, sec * 1000);
    };
    t = setTimeout(step, 600);
    if (!free) $("#skip").onclick = $("#next").onclick = () => show("checkin");
  }

  // ---------- check in ----------
  function checkin() {
    el(`
      ${session.quick ? backBtn() : stepBar(2)}
      <p class="eyebrow">Check in</p>
      ${!state.name ? `<input type="text" id="name" maxlength="30" placeholder="What should Luma call you? (optional)" aria-label="Your name" autocomplete="given-name">` : ""}
      <h2>How heavy did today feel?</h2>
      <div class="weights" role="group" aria-label="How heavy today felt">
        ${WEIGHTS.map((w) => `<button data-w="${w.v}" aria-pressed="${session.weight === w.v}"><i style="width:${w.size}px;height:${w.size}px"></i>${w.label}</button>`).join("")}
      </div>
      <p class="soft">What weighed on it? Pick any.</p>
      <div class="chips" role="group" aria-label="What weighed on today">${TAGS.map((t) => `<button data-t="${t}" aria-pressed="${session.tags.includes(t)}">${t}</button>`).join("")}</div>
      <div class="row end"><button class="primary" id="next" ${session.weight ? "" : "disabled"}>${session.quick ? "Light my firefly" : "Talk it out"}</button></div>
    `);
    wireBack();
    $$("[data-w]").forEach((b) => b.onclick = () => {
      session.weight = Number(b.dataset.w);
      $$("[data-w]").forEach((x) => x.setAttribute("aria-pressed", x === b));
      $("#next").disabled = false;
    });
    $$("[data-t]").forEach((b) => b.onclick = () => {
      const t = b.dataset.t, on = session.tags.includes(t);
      session.tags = on ? session.tags.filter((x) => x !== t) : session.tags.concat(t);
      b.setAttribute("aria-pressed", !on);
    });
    $("#next").onclick = () => {
      const n = $("#name");
      if (n && n.value.trim()) { state.name = n.value.trim(); persist(); }
      show(session.quick ? "close" : "talk");
    };
  }

  // ---------- talk with Luma ----------
  let ctl = null;
  function talk(free) {
    if (free) session = session && session.free ? session : { free: true, weight: 0, tags: [], turns: [], worries: [], intention: "" };
    el(`
      ${free ? backBtn() : stepBar(3)}
      <div class="talk" id="talk"></div>
      <form class="composer" id="form">
        <textarea id="say" rows="1" placeholder="Say anything. Luma's listening." maxlength="1200" aria-label="Your message"></textarea>
        <button class="primary send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="row split">
        <span class="tiny" id="hint">Luma is an AI. In a crisis, call your local emergency number.</span>
        ${free ? "" : `<button class="ghost" id="next">I'm ready to let go</button>`}
      </div>
    `, "chat");
    wireBack();
    const box = $("#talk"), say = $("#say");
    for (const t of session.turns) addMsg(t.role === "user" ? "me" : "luma", t.content);
    say.addEventListener("input", () => { say.style.height = "auto"; say.style.height = Math.min(120, say.scrollHeight) + "px"; });
    say.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
    $("#form").onsubmit = (e) => {
      e.preventDefault();
      const text = say.value.trim();
      if (!text || ctl) return;
      say.value = ""; say.style.height = "auto";
      addMsg("me", text);
      session.turns.push({ role: "user", content: text });
      lumaReply();
    };
    if (!free) $("#next").onclick = () => show("release");
    cleanup = () => { if (ctl) ctl.abort(); if (free) remember(session); };
    if (!session.turns.length) lumaOpen();

    function addMsg(who, text) {
      const m = document.createElement("div");
      m.className = "msg " + who; m.textContent = text;
      box.appendChild(m); box.scrollTop = box.scrollHeight;
      return m;
    }
    function waiting() { const m = addMsg("luma", ""); m.classList.add("wait"); m.innerHTML = '<span class="dots">Luma is thinking</span>'; return m; }
    function fallback() {
      addMsg("luma", "I can't talk in this view, but writing it out still helps. Type whatever's on your mind. It stays here, just for you.");
      $("#hint").textContent = "Luma's voice needs Claude access in this view.";
    }
    async function stream(input, bubble) {
      ctl = new AbortController();
      try {
        const { text } = await ask(input, { cache: false, signal: ctl.signal, onText: ({ text }) => { bubble.classList.remove("wait"); bubble.textContent = text; box.scrollTop = box.scrollHeight; } });
        return text;
      } catch (e) {
        const r = aiFailure(e);
        if (r === "off") { bubble.remove(); fallback(); }
        else if (r === "cancelled") { if (!e.text) bubble.remove(); }
        else { bubble.classList.add("wait"); bubble.textContent = (e.text ? e.text + "\n\n" : "") + r; }
        return null;
      } finally { ctl = null; }
    }
    async function lumaOpen() {
      const bubble = waiting();
      const opener = free
        ? "They opened a conversation with you outside the nightly ritual. Write a short, warm opening line that invites them to say what's on their mind. If you remember something fitting, you may mention it lightly."
        : "Write your opening line for tonight. Greet them warmly, acknowledge how the day felt in your own words, and ask one gentle question about it. If you remember something from earlier evenings that fits, you may mention it lightly.";
      const text = await stream([{ role: "user", content: rules(session) + "\n\n" + opener }], bubble);
      if (text) session.turns.push({ role: "assistant", content: text });
    }
    async function lumaReply() {
      if (aiOff) { addMsg("luma", "Saved. Keep going if there's more. 🌙"); return; }
      const bubble = waiting();
      const recent = session.turns.slice(-16);
      if (recent[0] && recent[0].role === "assistant") recent.unshift({ role: "user", content: "(we began talking)" });
      const text = await stream([{ role: "user", content: rules(session) + "\n\nThe conversation so far follows. Reply as Luma." }].concat(recent), bubble);
      if (text) session.turns.push({ role: "assistant", content: text });
    }
  }

  // ---------- worry lanterns ----------
  function release(free) {
    const worries = free ? [] : session.worries;
    el(`
      ${free ? backBtn() : stepBar(4)}
      <p class="eyebrow">Let go</p>
      <h2>Put a worry in a lantern.</h2>
      <p class="soft">Write it down, then release it. It floats away over the hill. You can pick it back up tomorrow if you really want to.</p>
      <form class="composer" id="form">
        <input type="text" id="worry" maxlength="120" placeholder="The thing that's still circling…" aria-label="A worry to release" autocomplete="off">
        <button class="ghost">Release</button>
      </form>
      <p class="tiny" id="released"></p>
      <div class="row split">
        ${free ? `<span></span><button class="primary" data-done>Done</button>` : `<button class="text-btn" id="skip">Nothing to let go tonight</button><button class="primary" id="next" ${worries.length ? "" : "hidden"}>Continue</button>`}
      </div>
    `);
    wireBack();
    const sync = () => {
      $("#released").textContent = worries.length ? `${worries.length} lantern${worries.length > 1 ? "s" : ""} released. Add another${free ? "" : ", or continue"}.` : "";
      if (!free) $("#next").hidden = !worries.length;
    };
    sync();
    $("#form").onsubmit = (e) => {
      e.preventDefault();
      const w = $("#worry").value.trim();
      if (!w) return;
      $("#worry").value = "";
      worries.push(w); sky.release(w); sync();
    };
    if (free) $("[data-done]").onclick = () => show("home");
    else $("#skip").onclick = $("#next").onclick = () => show("tomorrow");
  }

  // ---------- one small thing for tomorrow ----------
  function tomorrow() {
    el(`
      ${stepBar(5)}
      <p class="eyebrow">Tomorrow</p>
      <h2>One small, kind thing <em>for tomorrow.</em></h2>
      <p class="soft">Tiny on purpose. Something you could do even on a tired day.</p>
      <input type="text" id="plan" maxlength="120" placeholder="Take a real lunch break, outside" aria-label="One small thing for tomorrow" autocomplete="off" value="${esc(session.intention)}">
      <div class="row split">
        <button class="text-btn" id="idea" ${aiOff ? "hidden" : ""}>Ask Luma for an idea</button>
        <button class="primary" id="next">Light my firefly</button>
      </div>
    `);
    const plan = $("#plan"), idea = $("#idea");
    idea.onclick = async () => {
      idea.disabled = true; idea.textContent = "Luma is thinking…";
      const talked = session.turns.slice(-8).map((t) => (t.role === "user" ? "Them: " : "Luma: ") + t.content).join("\n");
      try {
        const { text } = await ask(rules(session) + "\n\nTonight's conversation:\n" + (talked || "(they didn't talk much)") +
          "\n\nSuggest ONE tiny, kind, concrete thing they could do tomorrow, fitted to what they shared. Under 12 words. Reply with only the suggestion, no quotes.", { cache: false });
        plan.value = text.trim().replace(/^["“]|["”]$/g, "");
        idea.textContent = "Another idea";
      } catch (e) { if (aiFailure(e) === "off") idea.hidden = true; else idea.textContent = "Try again"; }
      finally { idea.disabled = false; }
    };
    $("#next").onclick = () => { session.intention = plan.value.trim(); show("close"); };
  }

  // ---------- light the firefly, then tonight's gift ----------
  function close() {
    const already = doneTonight();
    let graceSaved = false;
    if (!already) {
      if (state.lastDate === daysAgo(1)) state.streak += 1;
      else if (state.lastDate === daysAgo(2) && (!state.graceDate || daysBetween(state.graceDate, dayKey()) >= 7)) { state.streak += 1; state.graceDate = dayKey(); graceSaved = true; }
      else state.streak = 1;
      state.best = Math.max(state.best || 0, state.streak);
      state.fireflies += 1;
      state.lastDate = dayKey();
      sky.lightOne(false);
      sound.chime();
    }
    if (session.intention) state.intention = { text: session.intention, date: dayKey(), done: null };
    state.history = state.history.filter((h) => h.date !== dayKey()).concat({ date: dayKey(), weight: session.weight, tags: session.tags, worries: session.worries.length }).slice(-90);
    persist();
    renderCount();
    const unlocked = !already && MILESTONES.find((m) => m.at === state.fireflies && m.at > 1);
    const next = nextMilestone();
    el(`
      <p class="eyebrow">${already ? "Tonight" : "Firefly no. " + state.fireflies}</p>
      <h2>${already ? "Still glowing." : "There it goes. <em>Goodnight.</em>"}</h2>
      ${unlocked ? `<p class="soft">Something new on the hill: ${unlocked.label}.</p>` : ""}
      ${graceSaved ? `<p class="soft">You missed a night, so Luma kept your streak safe. Rest nights are allowed, once a week.</p>` : ""}
      <div class="note"><div class="who">Luma</div><blockquote id="goodnight"><span class="dots">Writing you a note</span></blockquote></div>
      <div id="gift-slot">${already ? "" : `<button class="gift sealed" id="gift"><span class="kind">Tonight's gift</span><span class="body">Tap to open</span></button>`}</div>
      <p class="tiny">${next ? `Tomorrow: a new gift, and ${next.at - state.fireflies} more night${next.at - state.fireflies === 1 ? "" : "s"} until ${next.label}.` : "Tomorrow: a new gift is waiting."}${state.streak > 1 ? ` ${state.streak} nights in a row.` : ""}</p>
      <div class="row split">
        <button class="ghost" id="story">Bedtime story</button>
        <button class="primary" id="done">Back to the meadow</button>
      </div>
    `);
    $("#done").onclick = () => show("home");
    $("#story").onclick = () => show("story");
    const giftBtn = $("#gift");
    if (giftBtn) giftBtn.onclick = () => openGift();
    const note = $("#goodnight");
    const talked = session.turns.slice(-10).map((t) => (t.role === "user" ? "Them: " : "Luma: ") + t.content).join("\n");
    ask(rules(session) + "\n\nTonight's conversation:\n" + (talked || "(they kept it quiet tonight)") +
        (session.worries.length ? `\nThey released ${session.worries.length} worry lantern(s).` : "") +
        (session.intention ? `\nTomorrow's small thing: ${session.intention}` : "") +
        "\n\nWrite a goodnight note to them: 1 or 2 short sentences, warm and specific to tonight. Plain text only.",
        { cache: false, onText: ({ text }) => { note.textContent = text; } })
      .then(({ text }) => { note.textContent = text; })
      .catch(() => { note.textContent = "You showed up for yourself tonight. That's the whole job. Sleep well."; });
    remember(session);
  }

  // A sealed gift each evening: usually gentle, sometimes a letter, rarely a golden firefly.
  async function openGift() {
    const slot = $("#gift-slot");
    const roll = Math.random();
    let gift;
    if (roll < 0.08) {
      state.golden += 1;
      sky.lightOne(true);
      sound.chime();
      gift = { kind: "Rare gift", text: "A golden firefly. They're rare, and this one chose your meadow. It will glow there for good." };
    } else if (roll < 0.33 && !aiOff) {
      gift = { kind: "A letter from Luma", text: "" };
    } else {
      const kinds = Object.keys(GIFTS), kind = pick(kinds);
      const fresh = GIFTS[kind].filter((t) => !state.seenGifts.includes(t));
      const text = pick(fresh.length ? fresh : GIFTS[kind]);
      state.seenGifts = state.seenGifts.concat(text).slice(-60);
      gift = { kind, text };
    }
    slot.innerHTML = `<div class="gift open"><span class="kind">${esc(gift.kind)}</span><span class="body" id="gift-body">${gift.text ? esc(gift.text) : '<span class="dots">Luma is writing</span>'}</span></div>`;
    if (!gift.text) {
      try {
        const { text } = await ask(rules(session) + "\n\nWrite them a short letter (3 or 4 sentences) as a gift for tonight, signed \"Luma\". Be warm and hopeful without being cheesy. If you remember something specific about them, use it.",
          { cache: false, onText: ({ text }) => { $("#gift-body") && ($("#gift-body").textContent = text); } });
        gift.text = text;
      } catch (e) {
        aiFailure(e);
        gift = { kind: "Kind words", text: pick(GIFTS["Kind words"]) };
        slot.innerHTML = `<div class="gift open"><span class="kind">${gift.kind}</span><span class="body">${esc(gift.text)}</span></div>`;
      }
    }
    state.gifts = [{ kind: gift.kind, text: gift.text, date: dayKey() }].concat(state.gifts).slice(0, 80);
    persist();
    renderCount();
  }

  // ---------- sounds ----------
  function sounds() {
    el(`
      ${backBtn()}
      <p class="eyebrow">Sounds</p>
      <h2>Tune the night.</h2>
      <canvas id="wave" aria-hidden="true"></canvas>
      <div class="layers">${sound.LAYERS.map((l) => `
        <div class="layer ${sound.isOn(l.id) ? "on" : ""}" data-l="${l.id}">
          <button aria-pressed="${sound.isOn(l.id)}">${l.name}<span class="switch"></span></button>
          <input type="range" min="0" max="1" step="0.01" value="${sound.vol(l.id)}" aria-label="${l.name} volume">
        </div>`).join("")}
      </div>
      <h3>Brainwave tones</h3>
      <p class="tiny">Binaural beats: each ear hears a slightly different tone, and the brain perceives a slow pulse between them. Use headphones. Studies on their effect are mixed, but many people find them calming. Pair with rain or brown noise.</p>
      <div class="chips" role="group" aria-label="Brainwave tone">${Object.entries(TONES).map(([k, t]) => `<button data-tone="${k}" aria-pressed="${sound.tone() === k}">${t.name}${t.sub ? ` · ${t.sub}` : ""}</button>`).join("")}</div>
      <h3>Sleep timer</h3>
      <div class="chips" role="group" aria-label="Sleep timer">${[0, 15, 30, 60].map((m) => `<button data-timer="${m}">${m ? m + " min" : "Off"}</button>`).join("")}</div>
      <p class="tiny" id="timer-note"></p>
      <div class="row split"><button class="text-btn" id="stop-all">Stop everything</button><button class="primary" data-done>Done</button></div>
    `);
    wireBack();
    $("[data-done]").onclick = () => show("home");
    $$("[data-l]").forEach((row) => {
      const id = row.dataset.l;
      row.querySelector("button").onclick = () => {
        const on = sound.isOn(id);
        on ? sound.stop(id) : sound.start(id);
        if (id === "music") sound.setAuto(!on);
      };
      row.querySelector("input").oninput = (e) => sound.setVol(id, Number(e.target.value));
    });
    $$("[data-tone]").forEach((b) => b.onclick = () => sound.setTone(b.dataset.tone));
    $$("[data-timer]").forEach((b) => b.onclick = () => { sound.ensure(); sound.setTimer(Number(b.dataset.timer)); });
    $("#stop-all").onclick = () => { sound.stopAll(); sound.setTimer(0); sound.setAuto(false); };
    const refresh = () => {
      if (screen !== "sounds") return;
      $$("[data-l]").forEach((row) => { const on = sound.isOn(row.dataset.l); row.classList.toggle("on", on); row.querySelector("button").setAttribute("aria-pressed", on); });
      $$("[data-tone]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tone === sound.tone()));
      const left = sound.timerLeft();
      $$("[data-timer]").forEach((b) => b.setAttribute("aria-pressed", Number(b.dataset.timer) === sound.timerMin()));
      $("#timer-note").textContent = left ? `Fading out in about ${left} min.` : "";
    };
    soundsRefresh = refresh; refresh();
    // live waveform
    const cv = $("#wave"), cx = cv.getContext("2d"), buf = new Uint8Array(1024);
    let raf = 0;
    const draw = () => {
      const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
      if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
      const on = sound.wave(buf);
      cx.beginPath();
      for (let i = 0; i <= 128; i++) {
        const x = (i / 128) * w, v = on ? (buf[i * 8] - 128) / 128 : 0;
        const y = h / 2 + v * h * 0.9 + (on ? 0 : Math.sin(i / 8 + performance.now() / 900) * 2);
        i ? cx.lineTo(x, y) : cx.moveTo(x, y);
      }
      const g = cx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, "rgba(190,215,255,.7)"); g.addColorStop(0.5, "rgba(255,210,122,.95)"); g.addColorStop(1, "rgba(190,215,255,.7)");
      cx.strokeStyle = g; cx.lineWidth = 2; cx.stroke();
      raf = requestAnimationFrame(draw);
    };
    draw();
    cleanup = () => { cancelAnimationFrame(raf); soundsRefresh = null; };
  }

  // ---------- bedtime story ----------
  function story() {
    const speech = "speechSynthesis" in window;
    el(`
      ${backBtn()}
      <p class="eyebrow">Bedtime story</p>
      <h2>Tonight, <em>in the meadow.</em></h2>
      <div class="story" id="story"><span class="dots">Luma is writing your story</span></div>
      <div class="row split">
        <div class="row">
          ${speech ? `<button class="ghost" id="read">Read it to me</button>` : ""}
          <button class="text-btn" id="ambience">Add rain and music</button>
        </div>
        <button class="text-btn" id="another">Another story</button>
      </div>
    `);
    wireBack();
    const box = $("#story");
    let text = "", reading = false, ctl2 = new AbortController();
    const last = state.history[state.history.length - 1];
    const mood = last && last.date === dayKey() && last.weight ? `Today felt ${WEIGHT_WORDS[last.weight]} for them.` : "";
    const write = async () => {
      ctl2.abort(); ctl2 = new AbortController();
      box.innerHTML = '<span class="dots">Luma is writing your story</span>';
      try {
        const r = await ask(`Write a calming bedtime story of about 220 words, in second person and present tense, set in a quiet night meadow with a small cabin, a pond, fireflies and soft rain. Slow and sensory. Nothing dramatic happens. ${mood} ${state.name ? "You may use their name, " + state.name + ", once." : ""} Gently guide their body to relax. End with them drifting to sleep. Plain text, short paragraphs, no title.`,
          { cache: false, signal: ctl2.signal, onText: ({ text: t }) => { box.textContent = t; } });
        text = r.text; box.textContent = text;
      } catch (e) {
        if (e && e.code === "cancelled") return;
        aiFailure(e);
        text = pick(STORIES); box.textContent = text;
      }
    };
    write();
    $("#another").onclick = () => { stopReading(); write(); };
    $("#ambience").onclick = () => { sound.start("rain"); sound.start("music"); $("#ambience").textContent = "Rain and music on"; };
    function stopReading() { if (speech) speechSynthesis.cancel(); reading = false; const r = $("#read"); if (r) r.textContent = "Read it to me"; }
    if (speech) $("#read").onclick = () => {
      if (reading) return stopReading();
      if (!text) return;
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.82; u.pitch = 0.95;
      const voices = speechSynthesis.getVoices();
      const v = voices.find((v) => /en/i.test(v.lang) && /female|samantha|serena|karen|moira|google uk english female/i.test(v.name)) || voices.find((v) => /en/i.test(v.lang));
      if (v) u.voice = v;
      u.onend = stopReading;
      speechSynthesis.speak(u);
      reading = true; $("#read").textContent = "Stop reading";
    };
    cleanup = () => { ctl2.abort(); stopReading(); };
  }

  // ---------- gratitude stars ----------
  function stars() {
    el(`
      ${backBtn()}
      <p class="eyebrow">Your stars</p>
      <h2>Hang a good moment <em>in your sky.</em></h2>
      <p class="soft">Anything that went okay, made you smile, or that you're glad about. Each one becomes a star you can tap later to read again.</p>
      <form class="composer" id="form">
        <input type="text" id="good" maxlength="90" placeholder="My coworker brought me coffee" aria-label="A good moment" autocomplete="off">
        <button class="ghost">Add star</button>
      </form>
      ${state.stars.length ? `<ul class="list" id="list">${state.stars.slice().reverse().slice(0, 30).map((s) => `<li><span>${esc(s.text)}</span><small>${new Date(s.date + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></li>`).join("")}</ul>`
                         : `<p class="tiny">Your sky has no stars of your own yet. Start with one small thing.</p>`}
    `);
    wireBack();
    $("#form").onsubmit = (e) => {
      e.preventDefault();
      const text = $("#good").value.trim();
      if (!text) return;
      const star = { id: uid(), text, date: dayKey(), x: 0.06 + Math.random() * 0.88, y: Math.random() };
      state.stars = state.stars.concat(star).slice(-200);
      persist();
      sky.addStar(star, panel.getBoundingClientRect().top);
      sound.chime();
      show("stars");
      const n = state.stars.length;
      if ([1, 5, 10, 25, 50].includes(n)) $(".soft").textContent = n === 1 ? "Your first star. Look up: it's in your sky now. Tap it any night." : `${n} stars in your sky. On hard days, tap them and read them back.`;
    };
  }

  // ---------- your nights ----------
  function nights() {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const k = daysAgo(i);
      days.push({ k, h: state.history.find((h) => h.date === k), lit: state.lastDate === k || state.history.some((h) => h.date === k) });
    }
    const colW = 300 / 14;
    const chart = `<svg class="chart" viewBox="0 0 300 96" role="img" aria-label="How heavy each of the last 14 days felt">
      <line x1="0" y1="72" x2="300" y2="72" stroke="rgba(236,235,248,.12)"/>
      ${days.map((d, i) => {
        const x = i * colW + colW / 2;
        const lab = `<text x="${x}" y="90" text-anchor="middle">${new Date(d.k + "T12:00").toLocaleDateString(undefined, { weekday: "narrow" })}</text>`;
        if (!d.h || !d.h.weight) return `<circle cx="${x}" cy="62" r="2" fill="rgba(236,235,248,.2)"/>${lab}`;
        const r = 3 + d.h.weight * 1.6, y = 72 - d.h.weight * 11;
        return `<circle cx="${x}" cy="${y}" r="${r}" fill="${d.h.weight >= 4 ? "#b58cff" : "#ffd27a"}" opacity=".85"/>${lab}`;
      }).join("")}
    </svg>`;
    const hist = state.history.filter((h) => h.weight);
    const tagCount = {};
    hist.slice(-30).forEach((h) => (h.tags || []).forEach((t) => (tagCount[t] = (tagCount[t] || 0) + 1)));
    const topTag = Object.entries(tagCount).sort((a, b) => b[1] - a[1])[0];
    const recent = hist.slice(-7), before = hist.slice(-14, -7);
    const avg = (a) => a.reduce((s, h) => s + h.weight, 0) / a.length;
    let insight = "Check in for a few nights and patterns will show up here.";
    if (recent.length >= 3) {
      insight = topTag ? `Lately, the thing weighing on you most is <b>${esc(topTag[0].toLowerCase())}</b>.` : "";
      if (before.length >= 3) {
        const d = avg(recent) - avg(before);
        insight += d <= -0.5 ? " Your days have felt lighter this week than last. Something's working." : d >= 0.5 ? " This week has felt heavier than last. Be extra gentle with yourself." : " This week has felt about the same as last.";
      }
    }
    const kept = state.history.length;
    const time = nights.time || "21:00";
    el(`
      ${backBtn()}
      <p class="eyebrow">Your nights</p>
      <h2>How the days <em>have felt.</em></h2>
      ${chart}
      <p class="soft">${insight}</p>
      <div class="stats">
        <div><b>${state.fireflies}</b><span>nights lit</span></div>
        <div><b>${state.best || state.streak}</b><span>best streak</span></div>
        <div><b>${state.golden}</b><span>golden</span></div>
        <div><b>${state.gifts.length}</b><span>gifts</span></div>
      </div>
      <h3>Nightly reminder</h3>
      <p class="tiny">A set time makes a habit much easier to keep. Choose yours and add it to your calendar.</p>
      <div class="row"><input type="time" id="time" value="${time}" aria-label="Reminder time"><a class="ghost" id="cal" target="_blank" rel="noopener">Add to Google Calendar</a></div>
      <h3>What Luma remembers</h3>
      ${state.memory.length ? `<ul class="list">${state.memory.map((m, i) => `<li><span>${esc(m)}</span><button data-forget="${i}" aria-label="Forget this">✕</button></li>`).join("")}</ul><p class="tiny">Luma uses these so you don't have to repeat yourself. Remove anything you like.</p>`
                            : `<p class="tiny">Nothing yet. As you talk, Luma keeps a few short notes so it can remember you.</p>`}
      ${state.gifts.length ? `<h3>Gifts you've opened</h3><ul class="list">${state.gifts.slice(0, 15).map((g) => `<li><span><b style="color:var(--glow);font-weight:600">${esc(g.kind)}.</b> ${esc(g.text)}</span></li>`).join("")}</ul>` : ""}
      <p class="tiny">${kept} evening${kept === 1 ? "" : "s"} recorded.</p>
    `);
    wireBack();
    const cal = $("#cal"), tInput = $("#time");
    const setCal = () => {
      nights.time = tInput.value || "21:00";
      const [hh, mm] = nights.time.split(":").map(Number);
      const d = new Date(); d.setHours(hh, mm, 0, 0);
      if (d < new Date()) d.setDate(d.getDate() + 1);
      const fmt = (x) => x.getFullYear() + String(x.getMonth() + 1).padStart(2, "0") + String(x.getDate()).padStart(2, "0") + "T" + String(x.getHours()).padStart(2, "0") + String(x.getMinutes()).padStart(2, "0") + "00";
      const end = new Date(d.getTime() + 10 * 60000);
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      cal.href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
        + "&text=" + encodeURIComponent("Firefly: light tonight's firefly")
        + "&details=" + encodeURIComponent("Seven quiet minutes for yourself. Open Firefly in Claude.")
        + "&dates=" + fmt(d) + "/" + fmt(end) + (tz ? "&ctz=" + encodeURIComponent(tz) : "")
        + "&recur=" + encodeURIComponent("RRULE:FREQ=DAILY");
    };
    setCal(); tInput.oninput = setCal;
    $$("[data-forget]").forEach((b) => b.onclick = () => { state.memory.splice(Number(b.dataset.forget), 1); persist(); show("nights"); });
  }

  // After each conversation, Luma keeps a couple of short notes for next time.
  async function remember(s) {
    if (!s || s.remembered) return;
    const said = s.turns.filter((t) => t.role === "user").map((t) => t.content).join("\n");
    if (said.length < 20 || aiOff || !sample) return;
    s.remembered = true;
    try {
      const facts = await sample.json(
        "Here is what a person shared in a calm evening check-in app:\n\n" + said.slice(-4000) +
        "\n\nAlready remembered:\n" + (state.memory.join("\n") || "(nothing)") +
        "\n\nWrite up to 2 NEW short facts worth remembering for future evenings (their work, people in their life, what drains them, what they enjoy, what they hope for). Each under 15 words, third person. Skip anything already remembered. Reply with only a JSON array of strings; [] if nothing new.",
        { modelTier: "quick", cache: false });
      if (Array.isArray(facts) && facts.length) { state.memory = state.memory.concat(facts.map(String).filter(Boolean)).slice(-14); persist(); }
    } catch (e) {}
  }

  const SCREENS = {
    home, checkin, tomorrow, close, sounds, story, stars, nights,
    breathe: () => breathe(false), "breathe-free": () => breathe(true),
    talk: () => talk(false), "talk-free": () => talk(true),
    release: () => release(false), lanterns: () => release(true),
  };

  document.getElementById("sound-btn").onclick = () => {
    if (screen === "sounds") return show("home");
    if (["breathe", "checkin", "talk", "release", "tomorrow"].includes(screen)) {
      // mid-ritual: toggle the music instead of leaving the step
      const on = sound.isOn("music");
      on ? sound.stop("music") : sound.start("music");
      sound.setAuto(!on);
      return;
    }
    show("sounds");
  };

  // ================= start =================
  const firstTouch = (e) => {
    removeEventListener("pointerdown", firstTouch, true);
    removeEventListener("keydown", firstTouch, true);
    if (sound.auto() && !sound.playing() && !(e.target && e.target.closest && e.target.closest("#sound-btn"))) sound.start("music");
  };
  addEventListener("pointerdown", firstTouch, true);
  addEventListener("keydown", firstTouch, true);
  renderCount();
  show("home");
  connectStore();
})();
</script>
