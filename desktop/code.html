<!doctype html>
<html><head><meta charset="utf-8"><title>Firefly</title>
<style>
  body { margin: 0; padding: 20px; background: #1b1640; color: #fbf7ff; font: 15px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; }
  p { margin: 0 0 12px; }
  input { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 10px 12px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  button { font: 600 14px system-ui, sans-serif; border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; }
  .ok { background: #ffd27a; color: #07051a; } .no { background: transparent; color: #b9b3d6; }
</style></head>
<body>
  <p id="t"></p>
  <form id="f"><input id="c" autocomplete="off" autofocus><div class="row"><button type="button" class="no" id="no">Cancel</button><button class="ok">OK</button></div></form>
  <script>
    document.getElementById("t").textContent = new URLSearchParams(location.search).get("t") || "Access code";
    document.getElementById("f").onsubmit = (e) => { e.preventDefault(); code.answer(document.getElementById("c").value); };
    document.getElementById("no").onclick = () => code.answer(null);
  </script>
</body></html>
