<title>Firefly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a living night meadow fills the screen; one quiet glass panel floats over its lower part and changes with each step of the evening. The land always sits just above the panel. */
  :root {
    --night: #0b0d2a;
    --glow: #ffd27a;
    --glow-deep: #f2a83b;
    --mist: #ecebf8;
    --haze: #a9a6cc;
    --glass: rgba(20, 20, 52, 0.64);
    --glass-line: rgba(236, 235, 248, 0.14);
    --chip: rgba(236, 235, 248, 0.08);
    --luma: rgba(255, 210, 122, 0.10);
    --me: rgba(236, 235, 248, 0.12);
    --star: #cfe3ff;
    --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--mist); font: 16px/1.55 var(--body); overflow: hidden; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top {
    position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .brand { font-family: var(--display); font-size: 24px; font-style: italic; color: var(--glow); text-shadow: 0 0 18px rgba(255, 210, 122, .45); }
  .count { font-size: 13px; color: var(--haze); letter-spacing: .04em; }
  .top button { pointer-events: auto; }

  .tip {
    position: fixed; z-index: 4; max-width: 240px; transform: translate(-50%, calc(-100% - 14px));
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; padding: 8px 12px;
    font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.3;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    animation: rise .3s ease both; pointer-events: none;
  }
  .tip small { display: block; font: 12px var(--body); color: var(--haze); font-style: normal; margin-top: 2px; }

  .stage {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; justify-content: center;
  }
  .panel {
    width: 100%; max-width: 540px;
    background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px;
    padding: 22px 20px 20px;
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    display: flex; flex-direction: column; gap: 14px;
    max-height: calc(100dvh - 120px - env(safe-area-inset-top, 0px));
    min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    animation: rise .6s cubic-bezier(.2, .8, .2, 1) both;
  }
  .panel > * { flex-shrink: 0; }
  .panel.chat { overflow: hidden; }
  .panel.chat > .talk { flex-shrink: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--haze); margin: 0; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
  h1 { font-size: 40px; } h2 { font-size: 30px; } h3 { font-size: 22px; }
  h1 em, h2 em { color: var(--glow); }
  p { margin: 0; }
  .soft { color: var(--haze); font-size: 15px; }
  .tiny { font-size: 12px; color: var(--haze); }

  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--glow); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
  .primary {
    border: 0; border-radius: 999px; padding: 14px 22px;
    background: linear-gradient(180deg, var(--glow), var(--glow-deep));
    color: #2a1a05; font-weight: 700; font-size: 16px; text-decoration: none; display: inline-block;
    box-shadow: 0 0 28px rgba(255, 210, 122, .35); transition: transform .15s, box-shadow .3s;
  }
  .primary:hover { box-shadow: 0 0 40px rgba(255, 210, 122, .55); }
  .primary:active { transform: scale(.97); }
  .primary:disabled { opacity: .45; box-shadow: none; cursor: default; }
  .ghost { border: 1px solid var(--glass-line); background: transparent; border-radius: 999px; padding: 12px 18px; color: var(--mist); font-weight: 600; text-decoration: none; display: inline-block; }
  .text-btn { border: 0; background: none; color: var(--haze); padding: 6px 4px; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .back { border: 0; background: none; color: var(--haze); padding: 0; font-size: 14px; font-weight: 600; align-self: flex-start; }
  .round {
    border: 1px solid var(--glass-line); background: var(--glass); color: var(--mist);
    border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .eq i { width: 3px; background: var(--glow); border-radius: 2px; height: 4px; }
  .eq.on i { animation: eq 1s ease-in-out infinite; }
  .eq.on i:nth-child(2) { animation-delay: .2s; } .eq.on i:nth-child(3) { animation-delay: .4s; }
  @keyframes eq { 50% { height: 12px; } }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  .row.split { justify-content: space-between; }

  .note { border: 1px solid var(--glass-line); border-radius: 18px; padding: 14px 16px; background: var(--luma); }
  .note .who { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--glow); margin-bottom: 4px; }
  .note blockquote { margin: 0; font-family: var(--display); font-size: 21px; line-height: 1.3; font-style: italic; white-space: pre-wrap; }

  /* meadow activities */
  .tiles { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px 4px; }
  .tiles::-webkit-scrollbar { display: none; }
  .tile {
    flex: 0 0 128px; scroll-snap-align: start; text-align: start;
    border: 1px solid var(--glass-line); background: var(--chip); border-radius: 18px;
    padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
    transition: border-color .2s, background .2s;
  }
  .tile:hover { border-color: rgba(255, 210, 122, .4); background: rgba(255, 210, 122, .07); }
  .tile svg { width: 22px; height: 22px; color: var(--glow); }
  .tile b { font-size: 14px; }
  .tile span { font-size: 12px; color: var(--haze); line-height: 1.35; }

  /* breathing orb */
  .orb-wrap { display: grid; place-items: center; height: 180px; }
  .orb {
    width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle, #fff3cf 0%, var(--glow) 40%, rgba(255, 210, 122, 0) 72%);
    box-shadow: 0 0 60px rgba(255, 210, 122, .5);
    transition: transform 4s ease-in-out;
  }
  .breath-word { font-family: var(--display); font-size: 30px; text-align: center; min-height: 40px; }

  .weights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .weights button {
    border: 1px solid var(--glass-line); background: var(--chip); border-radius: 16px;
    padding: 12px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-size: 12px; color: var(--haze); min-width: 0;
  }
  .weights i { display: block; border-radius: 50%; background: var(--haze); opacity: .8; }
  .weights button[aria-pressed="true"] { border-color: var(--glow); color: var(--mist); background: rgba(255, 210, 122, .12); }
  .weights button[aria-pressed="true"] i { background: var(--glow); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 1px solid var(--glass-line); background: var(--chip); border-radius: 999px; padding: 8px 14px; font-size: 14px; color: var(--mist); }
  .chips button[aria-pressed="true"] { border-color: var(--glow); background: rgba(255, 210, 122, .14); }

  .talk { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 120px; flex: 1; padding-right: 2px; overscroll-behavior: contain; }
  .msg { flex-shrink: 0; max-width: 88%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise .35s ease both; }
  .msg.luma { background: var(--luma); border: 1px solid rgba(255, 210, 122, .18); align-self: flex-start; border-end-start-radius: 6px; }
  .msg.me { background: var(--me); align-self: flex-end; border-end-end-radius: 6px; }
  .msg.wait { color: var(--haze); font-style: italic; }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea, input[type="text"], input[type="time"] {
    flex: 1; min-width: 0; font: inherit; color: var(--mist);
    background: rgba(0, 0, 0, .25); border: 1px solid var(--glass-line); border-radius: 18px; padding: 12px 14px; resize: none;
  }
  input[type="time"] { flex: 0 0 auto; }
  textarea { max-height: 120px; }
  ::placeholder { color: var(--haze); opacity: .8; }
  .send { flex: none; width: 48px; height: 48px; padding: 0; display: grid; place-items: center; }
  .send svg { width: 20px; height: 20px; }

  .stats { display: flex; gap: 20px; flex-wrap: wrap; }
  .stats div { display: flex; flex-direction: column; }
  .stats b { font-family: var(--display); font-size: 30px; font-weight: 400; color: var(--glow); line-height: 1; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 13px; color: var(--haze); }
  .progress { height: 4px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--glow-deep), var(--glow)); border-radius: 4px; transition: width 1s ease; }
  .steps { display: flex; gap: 6px; }
  .steps i { flex: 1; height: 3px; border-radius: 3px; background: var(--chip); }
  .steps i.on { background: var(--glow); }

  /* sounds */
  #wave { width: 100%; height: 64px; display: block; border-radius: 14px; background: rgba(0, 0, 0, .2); }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .layer { border: 1px solid var(--glass-line); background: var(--chip); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .layer.on { border-color: rgba(255, 210, 122, .55); background: rgba(255, 210, 122, .08); }
  .layer button { border: 0; background: none; padding: 0; text-align: start; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .switch { width: 30px; height: 18px; border-radius: 999px; background: var(--chip); border: 1px solid var(--glass-line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--haze); transition: transform .2s; }
  .layer.on .switch { background: rgba(255, 210, 122, .35); }
  .layer.on .switch::after { transform: translateX(12px); background: var(--glow); }
  input[type="range"] { width: 100%; accent-color: var(--glow-deep); }

  /* gift */
  .gift {
    border: 1px solid rgba(255, 210, 122, .4); border-radius: 20px; padding: 18px;
    background: linear-gradient(160deg, rgba(255, 210, 122, .14), rgba(140, 120, 255, .08));
    text-align: start; display: flex; flex-direction: column; gap: 6px; width: 100%;
  }
  .gift.sealed { align-items: center; text-align: center; animation: glowPulse 2.4s ease-in-out infinite; }
  .gift.open { animation: unfold .7s cubic-bezier(.2, 1.3, .4, 1) both; }
  .gift .kind { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--glow); }
  .gift .body { font-family: var(--display); font-size: 22px; line-height: 1.3; white-space: pre-wrap; }
  @keyframes glowPulse { 50% { box-shadow: 0 0 34px rgba(255, 210, 122, .35); } }
  @keyframes unfold { from { opacity: 0; transform: rotateX(70deg) scale(.9); } to { opacity: 1; transform: none; } }

  .story { font-family: var(--display); font-size: 21px; line-height: 1.5; white-space: pre-wrap; }
  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
  .list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--glass-line); font-size: 15px; }
  .list li:first-child { border-top: 0; }
  .list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list li small { color: var(--haze); white-space: nowrap; }
  .list button { border: 0; background: none; color: var(--haze); padding: 0 4px; font-size: 15px; }
  .chart { width: 100%; aspect-ratio: 300 / 96; display: block; }
  .chart text { fill: var(--haze); font: 11px var(--body); }

  /* Luma: sits on the panel's top edge and reacts */
  .luma-char { position: fixed; z-index: 3; cursor: pointer; transition: top .5s cubic-bezier(.2, .8, .2, 1), left .5s, width .5s, height .5s; -webkit-tap-highlight-color: transparent; }
  .lm-svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .35)); }
  .lm-bob { transform-origin: 100px 215px; animation: lmBob 3.4s ease-in-out infinite; }
  .lm-hairback { transform-origin: 100px 60px; animation: lmSway 5s ease-in-out infinite; }
  .lm-ahoge { transform-origin: 100px 40px; animation: lmAhoge 2.6s ease-in-out infinite; }
  .lm-blink { transform-box: fill-box; transform-origin: center; animation: lmBlink 4.6s infinite; }
  .lm-glow { animation: lmGlow 2.4s ease-in-out infinite; }
  .lm-fly { animation: lmFly 3s ease-in-out infinite; }
  .lm-clip circle { animation: lmGlow 2s ease-in-out infinite; }
  .lm-twinkle { transform-box: fill-box; transform-origin: center; animation: lmTwinkle 1.4s ease-in-out infinite; }
  .lm-dots circle { animation: lmDot 1.2s ease-in-out infinite; }
  .lm-dots circle:nth-child(2) { animation-delay: .2s; } .lm-dots circle:nth-child(3) { animation-delay: .4s; }
  .lm-vein { animation: lmPulse .8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .lm-z { animation: lmZ 2.4s ease-in infinite; }
  .lm-heart { transform-box: fill-box; transform-origin: center; animation: lmHeart 1.6s ease-in-out infinite; }
  .lm-tear { animation: lmTear 2.2s ease-in infinite; }
  .luma-char[data-mood="excited"].lm-react .lm-svg { animation: lmHop .6s cubic-bezier(.3, 1.6, .5, 1); }
  .luma-char[data-mood="happy"].lm-react .lm-svg { animation: lmHop .5s ease; }
  .luma-char[data-mood="pout"].lm-react .lm-svg { animation: lmShake .45s ease; }
  .luma-char[data-mood="shy"].lm-react .lm-svg { animation: lmSquish .6s ease; }
  .luma-char[data-mood="sleepy"] .lm-bob { animation-duration: 5.5s; }
  .luma-char:active .lm-svg { transform: scale(.94); }
  .lm-say {
    position: absolute; bottom: 62%; inset-inline-end: 92%; width: max-content; max-width: min(220px, 60vw);
    background: #fffaf0; color: #2b2033; border-radius: 16px; padding: 8px 12px;
    font-size: 14px; line-height: 1.45; font-weight: 600; box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
  }
  .lm-say::after { content: ""; position: absolute; bottom: 10px; inset-inline-end: -6px; width: 12px; height: 12px; background: #fffaf0; transform: rotate(45deg); border-radius: 2px; }
  .lm-say.in { animation: lmPop .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes lmBob { 50% { transform: translateY(-4px); } }
  @keyframes lmSway { 50% { transform: rotate(1.2deg); } }
  @keyframes lmAhoge { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes lmBlink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes lmGlow { 50% { opacity: .55; } }
  @keyframes lmFly { 0%, 100% { transform: translate(0, 0); } 33% { transform: translate(4px, -5px); } 66% { transform: translate(-4px, -2px); } }
  @keyframes lmTwinkle { 50% { transform: scale(.4) rotate(20deg); opacity: .5; } }
  @keyframes lmDot { 50% { transform: translateY(-4px); opacity: .5; } }
  @keyframes lmPulse { 50% { transform: scale(1.25); } }
  @keyframes lmZ { 0% { opacity: 0; transform: translate(0, 6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -14px); } }
  @keyframes lmHeart { 50% { transform: scale(1.2) translateY(-3px); } }
  @keyframes lmTear { 0% { opacity: 0; transform: translateY(-4px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }
  @keyframes lmHop { 40% { transform: translateY(-14px) scale(1.04, .96); } 70% { transform: translateY(0) scale(.97, 1.03); } }
  @keyframes lmShake { 20%, 60% { transform: translateX(-4px) rotate(-3deg); } 40%, 80% { transform: translateX(4px) rotate(3deg); } }
  @keyframes lmSquish { 40% { transform: scale(1.05, .92); } }
  @keyframes lmPop { from { opacity: 0; transform: scale(.6) translateY(8px); } }

  /* Arabic: its own typefaces, no faux italics, right-to-left details */
  :root[lang="ar"] { --display: "Amiri", "Noto Naskh Arabic", serif; --body: "IBM Plex Sans Arabic", "Noto Sans Arabic", system-ui, sans-serif; }
  :root[lang="ar"] em, :root[lang="ar"] .brand, :root[lang="ar"] .note blockquote, :root[lang="ar"] .tip, :root[lang="ar"] .msg.wait { font-style: normal; }
  :root[lang="ar"] .eyebrow, :root[lang="ar"] .note .who, :root[lang="ar"] .gift .kind { letter-spacing: 0; text-transform: none; font-size: 13px; }
  :root[lang="ar"] h1 { line-height: 1.35; } :root[lang="ar"] h2, :root[lang="ar"] h3 { line-height: 1.4; }
  :root[lang="ar"] .note blockquote, :root[lang="ar"] .gift .body, :root[lang="ar"] .story { line-height: 1.75; }
  :root[lang="ar"] .breath-word { line-height: 1.5; }
  [dir="rtl"] .send svg { transform: scaleX(-1); }
  [dir="rtl"] .layer.on .switch::after { transform: translateX(-12px); }
  #lang-btn { font-family: "IBM Plex Sans Arabic", var(--body); }
  :root[lang="ar"] #lang-btn { font-family: var(--body); }

  @media (max-height: 640px) {
    h1 { font-size: 32px; } h2 { font-size: 25px; }
    .orb-wrap { height: 130px; }
    .panel { padding: 18px 16px 16px; gap: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="top">
  <span class="brand" id="brand">Firefly</span>
  <div class="row">
    <span class="count" id="count"></span>
    <button class="round" id="lang-btn" lang="ar">عربي</button>
    <button class="round" id="sound-btn"><span class="eq" id="eq"><i></i><i></i><i></i></span><span id="sound-label">Sounds</span></button>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="luma-char" id="luma"></div>

<div class="stage"><section class="panel" id="panel" aria-live="polite"></section></div>

<script>
(() => {
  // ================= language file: English and Arabic (simple Modern Standard Arabic) =================
  const LANG_LS = "firefly-lang";
  let lang = "en";
  try { lang = localStorage.getItem(LANG_LS) || ((navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en"); } catch (e) {}
  if (lang !== "ar") lang = "en";

  const S = {
    en: {
      brand: "Firefly", sounds: "Sounds", langSwitch: "عربي", count: "{n} fireflies",
      partLate: "Late night", partMorning: "Morning", partAfternoon: "Afternoon", partEvening: "Evening",
      hiName: ", {name}",
      greetFirst: "Hello. <em>Breathe out.</em>",
      greetDone: "Tonight's light <em>is lit{hi}.</em>",
      greetBack: "Welcome back{hi}. <em>Sit a while.</em>",
      leadFirst: "Seven quiet minutes each evening. Talk it out with Luma, let a worry go, and light a firefly. Come back each night and the hill slowly comes alive.",
      leadDone: "Stay as long as you like. Put on some sounds, hear a bedtime story, or add a star to your sky.",
      leadBack: "The meadow kept your fireflies safe. Tonight's gift is waiting at the end.",
      lastPlanned: "Last time you planned", itHappened: "It happened", notYet: "Not yet, that's okay",
      niceDone: "Nicely done", niceDoneQ: "Small things done tired count double.",
      okay: "That's okay", okayQ: "Tomorrow is a fresh page.",
      statFireflies: "fireflies", statRow: "nights in a row", statStars: "stars",
      untilNext: "{n} more nights until {label}",
      allAwake: "The whole hill is awake. Every firefly here is an evening you showed up for yourself.",
      beginFirst: "Light your first firefly", begin: "Begin tonight · 7 min", quick: "Too tired? 1-minute version",
      inMeadow: "In the meadow",
      tileSounds: "Sounds", tileSoundsD: "Music, rain, brainwave tones",

  // Pull Luma's mood tag off the front of a reply: "[happy] Hello" -> { mood: "happy", body: "Hello" }.
  function readMood(text) {

    return { mood: null, body: text, pending: false };
  }
  const clean = (text) => readMood(text).body || text;

  function lumaForScreen(name) {

    const [m, text] = L[key];

  }

  // ================= screens =================

  const nextMilestone = () => milestones().find((m) => m.at > state.fireflies);
  const prevMilestoneAt = () => { const d = milestones().filter((m) => m.at <= state.fireflies); return d.length ? d[d.length - 1].at : 0; };

  function show(name, arg) {

  const ICONS = {

  // ---------- home ----------
  function home() {
    const h = new Date().getHours();
    const part = t(h < 5 ? "partLate" : h < 12 ? "partMorning" : h < 17 ? "partAfternoon" : "partEvening");
    const weekday = new Date().toLocaleDateString(locale(), { weekday: "long" });
    const next = nextMilestone(), from = prevMilestoneAt();
    const pct = next ? Math.round(((state.fireflies - from) / (next.at - from)) * 100) : 100;

  // ---------- breathing (ritual step and free practice) ----------
  function breathe(free) {
    const key = free ? (breathe.key || "calm") : "calm";
    el(`
      ${free ? backBtn() : stepBar(1)}
      <p class="eyebrow">${t(free ? "breatheEyebrow" : "arriveEyebrow")}</p>
      <h2>${t(free ? "breatheFreeTitle" : "breatheTitle")}</h2>
      ${free ? `<div class="chips" role="group" aria-label="${t("breathPattern")}">${Object.keys(BREATHS).map((k) => `<button data-b="${k}" aria-pressed="${k === key}">${c().breaths[k][0]}</button>`).join("")}</div><p class="tiny">${c().breaths[key][1]}</p>` : ""}

    }
    const orb = $("#orb"), word = $("#word"), pattern = BREATHS[key];
    let i = 0, rounds = 0, tm = null, alive = true;
    cleanup = () => { alive = false; clearTimeout(tm); };
    const step = () => {
      if (!alive) return;
      const [kind, sec] = pattern[i % pattern.length];

      orb.style.transitionDuration = sec + "s";
      if (kind === "in") orb.style.transform = "scale(2.3)";

  // ---------- check in ----------
  function checkin() {
    el(`

  // ---------- talk with Luma ----------
  let ctl = null;
  function talk(free) {
    if (free) session = session && session.free ? session : { free: true, weight: 0, tags: [], turns: [], worries: [], intention: "" };
    el(`
      ${free ? backBtn() : stepBar(3)}
      <div class="talk" id="talk"></div>
      <form class="composer" id="form">
        <textarea id="say" rows="1" placeholder="${t("sayPh")}" maxlength="1200" aria-label="${t("yourMsg")}"></textarea>
        <button class="primary send" aria-label="${t("send")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="row split">
        <span class="tiny" id="hint">${t("aiHint")}</span>
        ${free ? "" : `<button class="ghost" id="next">${t("readyLetGo")}</button>`}
      </div>
    `, "chat");
    wireBack();
    const box = $("#talk"), say = $("#say");
    for (const turn of session.turns) addMsg(turn.role === "user" ? "me" : "luma", turn.content);
    say.addEventListener("input", () => { say.style.height = "auto"; say.style.height = Math.min(120, say.scrollHeight) + "px"; });
    say.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#form").requestSubmit(); } });
    $("#form").onsubmit = (e) => {
      e.preventDefault();

      if (!text || ctl) return;
      say.value = ""; say.style.height = "auto";

      session.turns.push({ role: "user", content: text });
      lumaReply();
    };
    if (!free) $("#next").onclick = () => show("release");
    cleanup = () => { if (ctl) ctl.abort(); if (free) remember(session); };
    if (!session.turns.length) lumaOpen();

    function addMsg(who, text) {
      const m = document.createElement("div");
      m.className = "msg " + who; m.textContent = text; m.dir = "auto";
      box.appendChild(m); box.scrollTop = box.scrollHeight;
      return m;
    }
    function waiting() { luma.set("thinking"); const m = addMsg("luma", ""); m.classList.add("wait"); m.innerHTML = `<span class="dots">${t("thinking")}</span>`; return m; }
    function fallback() { addMsg("luma", t("noAi")); $("#hint").textContent = t("noAiHint"); }
    async function stream(input, bubble) {
      ctl = new AbortController();
      try {
        let shown = false;
        const { text } = await ask(input, { cache: false, signal: ctl.signal, onText: ({ text }) => {
          const r = readMood(text);
          if (r.pending) return;
          if (r.mood && !shown) luma.set(r.mood);
          if (!r.body) return;
          shown = true;
          bubble.classList.remove("wait"); bubble.textContent = r.body; box.scrollTop = box.scrollHeight;
        } });
        const r = readMood(text);
        if (!r.mood && luma.mood() === "thinking") luma.set("listening");
        bubble.classList.remove("wait"); bubble.textContent = r.body || text;
        return r.body || text;
      } catch (e) {
        const r = aiFailure(e);
        if (r === "off") { bubble.remove(); fallback(); }
        else if (r === "cancelled") { if (!e.text) bubble.remove(); }
        else { bubble.classList.add("wait"); bubble.textContent = (e.text ? e.text + "\n\n" : "") + r; }
        return null;
      } finally { ctl = null; }
    }
    async function lumaOpen() {
      const bubble = waiting();
      const opener = free
        ? "They opened a conversation with you outside the nightly ritual. Write a short, warm opening line that invites them to say what's on their mind. If you remember something fitting, you may mention it lightly."
        : "Write your opening line for tonight. Greet them warmly, acknowledge how the day felt in your own words, and ask one gentle question about it. If you remember something from earlier evenings that fits, you may mention it lightly.";
      const text = await stream([{ role: "user", content: rules(session) + "\n\n" + opener + "\n\nStart your reply with exactly one mood tag in square brackets showing your face as you say it, chosen from: [happy] [listening] [thinking] [sad] [pout] [excited] [shy] [sleepy]. Then write the message. The tag is never shown to them." }], bubble);
      if (text) session.turns.push({ role: "assistant", content: text });
    }
    async function lumaReply() {
      if (aiOff) { addMsg("luma", t("saved")); return; }
      const bubble = waiting();
      const recent = session.turns.slice(-16);
      if (recent[0] && recent[0].role === "assistant") recent.unshift({ role: "user", content: "(we began talking)" });
      const text = await stream([{ role: "user", content: rules(session) + "\n\nStart your reply with exactly one mood tag in square brackets showing your face as you say it, chosen from: [happy] [listening] [thinking] [sad] [pout] [excited] [shy] [sleepy]. Then write the message. The tag is never shown to them.\n\nThe conversation so far follows. Reply as Luma." }].concat(recent), bubble);
      if (text) session.turns.push({ role: "assistant", content: text });
    }
  }

  // A sealed gift each evening: usually gentle, sometimes a letter, rarely a golden firefly.
  async function openGift() {
    const slot = $("#gift-slot");
    const roll = Math.random();
    const gifts = c().gifts;
    let gift;
    if (roll < 0.08) {
      state.golden += 1;
      sky.lightOne(true);
      sound.chime();
      gift = { kind: t("rareGift"), text: t("rareText") };
      luma.set("excited");
    } else if (roll < 0.33 && !aiOff) {
      gift = { kind: t("letter"), text: "" };
    } else {
      const kind = pick(Object.keys(gifts));
      const fresh = gifts[kind].filter((x) => !state.seenGifts.includes(x));
      const text = pick(fresh.length ? fresh : gifts[kind]);
      state.seenGifts = state.seenGifts.concat(text).slice(-60);
      gift = { kind, text };
    }
    slot.innerHTML = `<div class="gift open"><span class="kind">${esc(gift.kind)}</span><span class="body" id="gift-body" dir="auto">${gift.text ? esc(gift.text) : `<span class="dots">${t("lumaWriting")}</span>`}</span></div>`;
    if (!gift.text) {
      try {
        const { text } = await ask(rules(session) + `\n\nWrite them a short letter (3 or 4 sentences) as a gift for tonight, signed "${t("luma")}". Be warm and hopeful without being cheesy. If you remember something specific about them, use it.`,
          { cache: false, onText: ({ text }) => { const b = $("#gift-body"); if (b) b.textContent = clean(text); } });
        gift.text = clean(text);
      } catch (e) {
        aiFailure(e);
        const kind = Object.keys(gifts)[0];
        gift = { kind, text: pick(gifts[kind]) };
        slot.innerHTML = `<div class="gift open"><span class="kind">${esc(gift.kind)}</span><span class="body">${esc(gift.text)}</span></div>`;
      }
    }
    state.gifts = [{ kind: gift.kind, text: gift.text, date: dayKey() }].concat(state.gifts).slice(0, 80);
    persist();
    renderChrome();
  }

    const refresh = () => {

    };
    soundsRefresh = refresh; refresh();
    const cv = $("#wave"), cx = cv.getContext("2d"), buf = new Uint8Array(1024);
    let raf = 0;
    const draw = () => {
      const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
      if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
      const on = sound.wave(buf);
      cx.beginPath();
      for (let i = 0; i <= 128; i++) {
        const x = (i / 128) * w, v = on ? (buf[i * 8] - 128) / 128 : 0;
        const y = h / 2 + v * h * 0.9 + (on ? 0 : Math.sin(i / 8 + performance.now() / 900) * 2);
        i ? cx.lineTo(x, y) : cx.moveTo(x, y);
      }
      const g = cx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, "rgba(190,215,255,.7)"); g.addColorStop(0.5, "rgba(255,210,122,.95)"); g.addColorStop(1, "rgba(190,215,255,.7)");
      cx.strokeStyle = g; cx.lineWidth = 2; cx.stroke();
      raf = requestAnimationFrame(draw);
    };
    draw();
    cleanup = () => { cancelAnimationFrame(raf); soundsRefresh = null; };
  }

  // ---------- your nights ----------
  function nights() {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const k = daysAgo(i);
      days.push({ k, h: state.history.find((h) => h.date === k) });
    }
    const colW = 300 / 14;
    const chart = `<svg class="chart" viewBox="0 0 300 96" role="img" aria-label="${t("chartLabel")}">
      <line x1="0" y1="72" x2="300" y2="72" stroke="rgba(236,235,248,.12)"/>
      ${days.map((d, i) => {
        const x = (lang === "ar" ? 13 - i : i) * colW + colW / 2;
        const lab = `<text x="${x}" y="90" text-anchor="middle">${new Date(d.k + "T12:00").toLocaleDateString(locale(), { weekday: "narrow" })}</text>`;
        if (!d.h || !d.h.weight) return `<circle cx="${x}" cy="62" r="2" fill="rgba(236,235,248,.2)"/>${lab}`;
        const r = 3 + d.h.weight * 1.6, y = 72 - d.h.weight * 11;
        return `<circle cx="${x}" cy="${y}" r="${r}" fill="${d.h.weight >= 4 ? "#b58cff" : "#ffd27a"}" opacity=".85"/>${lab}`;
      }).join("")}
    </svg>`;
    const hist = state.history.filter((h) => h.weight);
    const tagCount = {};
    hist.slice(-30).forEach((h) => (h.tags || []).forEach((x) => (tagCount[x] = (tagCount[x] || 0) + 1)));
    const topTag = Object.entries(tagCount).sort((a, b) => b[1] - a[1])[0];
    const recent = hist.slice(-7), before = hist.slice(-14, -7);
    const avg = (a) => a.reduce((s, h) => s + h.weight, 0) / a.length;
    let insight = t("insightEmpty");
    if (recent.length >= 3) {
      insight = topTag ? t("insightTag", { tag: esc(c().tags[topTag[0]] || topTag[0]) }) : "";
      if (before.length >= 3) {
        const d = avg(recent) - avg(before);
        insight += t(d <= -0.5 ? "insightLighter" : d >= 0.5 ? "insightHeavier" : "insightSame");
      }
    }
    const time = nights.time || "21:00";
    el(`
      ${backBtn()}
      <p class="eyebrow">${t("nightsEyebrow")}</p>
      <h2>${t("nightsTitle")}</h2>
      ${chart}
      <p class="soft">${insight}</p>
      <div class="stats">
        <div><b>${num(state.fireflies)}</b><span>${t("statLit")}</span></div>
        <div><b>${num(state.best || state.streak)}</b><span>${t("statBest")}</span></div>
        <div><b>${num(state.golden)}</b><span>${t("statGolden")}</span></div>

      <div class="row"><input type="time" id="time" value="${time}" aria-label="${t("reminderTime")}"><a class="ghost" id="cal" target="_blank" rel="noopener">${t("addCal")}</a></div>
      <h3>${t("remembersTitle")}</h3>
      ${state.memory.length ? `<ul class="list">${state.memory.map((m, i) => `<li><span dir="auto">${esc(m)}</span><button data-forget="${i}" aria-label="${t("forget")}">✕</button></li>`).join("")}</ul><p class="tiny">${t("remembersNote")}</p>`
                            : `<p class="tiny">${t("remembersNone")}</p>`}
      ${state.gifts.length ? `<h3>${t("giftsTitle")}</h3><ul class="list">${state.gifts.slice(0, 15).map((g) => `<li><span dir="auto"><b style="color:var(--glow);font-weight:600">${esc(g.kind)}.</b> ${esc(g.text)}</span></li>`).join("")}</ul>` : ""}
      <p class="tiny">${t("recorded", { n: num(state.history.length) })}</p>
    `);
    wireBack();
    const cal = $("#cal"), tInput = $("#time");
    const setCal = () => {
      nights.time = tInput.value || "21:00";
      const [hh, mm] = nights.time.split(":").map(Number);
      const d = new Date(); d.setHours(hh, mm, 0, 0);
      if (d < new Date()) d.setDate(d.getDate() + 1);
      const fmt = (x) => x.getFullYear() + String(x.getMonth() + 1).padStart(2, "0") + String(x.getDate()).padStart(2, "0") + "T" + String(x.getHours()).padStart(2, "0") + String(x.getMinutes()).padStart(2, "0") + "00";
      const end = new Date(d.getTime() + 10 * 60000);
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      cal.href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
        + "&text=" + encodeURIComponent(t("calTitle"))
        + "&details=" + encodeURIComponent(t("calDetails"))
        + "&dates=" + fmt(d) + "/" + fmt(end) + (tz ? "&ctz=" + encodeURIComponent(tz) : "")
        + "&recur=" + encodeURIComponent("RRULE:FREQ=DAILY");
    };
    setCal(); tInput.oninput = setCal;
    $$("[data-forget]").forEach((b) => b.onclick = () => { state.memory.splice(Number(b.dataset.forget), 1); persist(); show("nights"); });
  }

  // After each conversation, Luma keeps a couple of short notes for next time.
  async function remember(s) {
    if (!s || s.remembered) return;
    const said = s.turns.filter((x) => x.role === "user").map((x) => x.content).join("\n");
    if (said.length < 20 || aiOff || !sample) return;
    s.remembered = true;
    try {
      const facts = await sample.json(
        "Here is what a person shared in a calm evening check-in app:\n\n" + said.slice(-4000) +
        "\n\nAlready remembered:\n" + (state.memory.join("\n") || "(nothing)") +
        `\n\nWrite up to 2 NEW short facts worth remembering for future evenings (their work, people in their life, what drains them, what they enjoy, what they hope for). Each under 15 words, third person, written in ${lang === "ar" ? "simple Modern Standard Arabic" : "English"}. Skip anything already remembered. Reply with only a JSON array of strings; [] if nothing new.`,
        { modelTier: "quick", cache: false });
      if (Array.isArray(facts) && facts.length) { state.memory = state.memory.concat(facts.map(String).filter(Boolean)).slice(-14); persist(); }
    } catch (e) {}
  }

  const SCREENS = {
    home, checkin, tomorrow, close, sounds, story, stars, nights,
    breathe: () => breathe(false), "breathe-free": () => breathe(true),
    talk: () => talk(false), "talk-free": () => talk(true),
    release: () => release(false), lanterns: () => release(true),
  };

  document.getElementById("sound-btn").onclick = () => {
    if (screen === "sounds") return show("home");
    if (["breathe", "checkin", "talk", "release", "tomorrow"].includes(screen)) {
      // mid-ritual: toggle the music instead of leaving the step
      const on = sound.isOn("music");
      on ? sound.stop("music") : sound.start("music");
      sound.setAuto(!on);
      return;
    }
    show("sounds");
  };
  document.getElementById("lang-btn").onclick = () => {
    lang = lang === "ar" ? "en" : "ar";
    try { localStorage.setItem(LANG_LS, lang); } catch (e) {}
    applyLang();
    renderChrome();
    show(screen);
  };

  // ================= start =================
  const firstTouch = (e) => {
    removeEventListener("pointerdown", firstTouch, true);
    removeEventListener("keydown", firstTouch, true);
    if (sound.auto() && !sound.playing() && !(e.target && e.target.closest && e.target.closest("#sound-btn"))) sound.start("music");
  };
  addEventListener("pointerdown", firstTouch, true);
  addEventListener("keydown", firstTouch, true);
  renderChrome();
  show("home");
  connectStore();
})();
</script>
