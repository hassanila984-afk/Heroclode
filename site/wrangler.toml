name = "firefly"
pages_build_output_dir = "../firefly"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MODEL = "claude-haiku-5-5"
DAILY_LIMIT = "1500"

# per-device daily request cap (see functions/api/ask.js)
[[kv_namespaces]]
binding = "FIREFLY_KV"
id = "2b92d956c384435bbfdd6e3be68253c6"

# Whisper speech-to-text for the call's sound (functions/api/hear.js)
[ai]
binding = "AI"
